<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📺</div>
    <div><div class="logo-text">Watchlist Tracker</div></div>
  </div>
  <div class="topbar-right">
    <span class="backup-age" id="backupAgeIndicator"></span>
    <button class="btn" id="backupBtn" onclick="handleBackupClick()">⬇ Backup</button>
    <button class="btn" id="restoreBtn" onclick="handleRestoreClick()">⬆ Restore</button>
    <input type="file" id="restoreFileInput" accept="application/json" style="display:none" onchange="handleRestoreFileSelected(event)">
    <span class="save-status" id="saveStatus">Saved ✓</span>
  </div>
</div>

<div id="restoreModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="restoreModalBox"></div>
</div>

<div class="media-switch" id="mediaSwitch"></div>

<div class="tabs" id="tabBar"></div>

<div class="main">
  <div id="banner"></div>
  <div id="errorBanner"></div>
  <div class="stats-row" id="statsRow"></div>

  <div class="filters" id="filtersRow"></div>

  <div id="tmdbPanel" class="tmdb-panel" style="display:none"></div>

  <table id="desktopTable">
    <thead id="tableHead">
      <tr>
        <th>Show &amp; Season</th>
        <th>Theme</th>
        <th>Premiere</th>
        <th>Status</th>
        <th>Watched</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="cardList" class="card-list"></div>

  <div class="add-form" id="addForm" style="display:none">
    <div class="add-form-title">Add a new entry</div>
    <div class="add-form-grid" id="addFormGrid"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="identity.js"></script>
<script src="api.js"></script>
<script src="ui-helpers.js"></script>
<script src="backup-restore.js"></script>
<script src="tabs.js"></script>
<script src="render.js"></script>
<script src="row-actions.js"></script>
<script src="tmdb-search.js"></script>
<script src="collections-pull.js"></script>
<script src="universe-pull.js"></script>
<script src="person-pull.js"></script>
<script src="refresh-shows.js"></script>
