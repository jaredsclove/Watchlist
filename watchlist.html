<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist Tracker</title>
<link rel="stylesheet" href="styles.css?v=20261028-dates">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📺</div>
    <div><div class="logo-text">Watchlist Tracker</div></div>
  </div>
  <div class="topbar-right">
    <button class="btn" id="backupBtn" onclick="handleBackupClick(this)">⬇ Backup</button>
    <span id="settingsEntry"></span>
    <input type="file" id="restoreFileInput" accept="application/json" style="display:none" onchange="handleRestoreFileSelected(event)">
    <input type="file" id="cuFileInput" accept="application/json" style="display:none" onchange="handleCuFileSelected(event)">
    <span class="save-status" id="saveStatus">Saved ✓</span>
    <button class="backup-age" id="backupAgeIndicator" title="Open Backup &amp; Restore in Settings" onclick="openSettings(this, 'backup')"></button>
  </div>
</div>

<div id="authScreen" class="auth-screen"></div>
<div id="authModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="authModalBox" role="dialog" aria-modal="true" aria-labelledby="authTitle"></div>
</div>

<div id="restoreModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="restoreModalBox"></div>
</div>

<div id="manageModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="manageModalBox" role="dialog" aria-modal="true" aria-labelledby="manageTitle" tabindex="-1" onkeydown="manageKeydown(event)"></div>
</div>
<div id="cuModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="cuModalBox" role="dialog" aria-modal="true" aria-labelledby="cuTitle" tabindex="-1" onkeydown="cuModalKeydown(event)"></div>
</div>
<div id="detailsModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="detailsModalBox" role="dialog" aria-modal="true" aria-labelledby="detailsTitle" tabindex="-1" onkeydown="detailsKeydown(event)"></div>
</div>
<div id="addPickerOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="addPickerBox" role="dialog" aria-modal="true" aria-labelledby="addPickerTitle" tabindex="-1" onkeydown="addPickerKeydown(event)"></div>
</div>
<div id="effectModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="effectModalBox" role="alertdialog" aria-modal="true" aria-labelledby="effectModalText" tabindex="-1" onkeydown="effectDialogKeydown(event)"></div>
</div>

<div class="media-switch" id="mediaSwitch"></div>

<div class="tabs" id="tabBar"></div>

<div class="browse-bar" id="browseBar"></div>

<div class="main" id="mainContent">
  <div id="phaseBanner"></div>
  <div id="unknownBanner"></div>
  <div id="noticeBanner"></div>
  <div id="banner"></div>
  <div id="errorBanner"></div>
  <div id="viewHead"></div>
  <div id="settingsScreen" class="settings-screen" style="display:none"></div>
  <div class="filters" id="filtersRow"></div>
  <div class="stats-row" id="statsRow"></div>
  <div id="readStatus" class="read-status"></div>

  <div id="tmdbPanel" class="tmdb-panel" style="display:none"></div>
  <div id="libraryPanel" class="tmdb-panel library-panel" style="display:none"></div>

  <table id="desktopTable">
    <thead id="tableHead">
      <tr>
        <th>Show &amp; Season</th>
        <th>Theme</th>
        <th>Premiere</th>
        <th>Status</th>
        <th>Watched</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="cardList" class="card-list"></div>

  <div class="add-form" id="addForm" style="display:none">
    <div class="add-form-title">Add a new entry</div>
    <div class="add-form-grid" id="addFormGrid"></div>
  </div>
</div>

     unversioned (it holds only settings that don't change with a release). -->

<script src="ui-helpers.js?v=20261028-dates"></script>

<script src="collections-pull.js?v=20261028-dates"></script>
<script src="universe-pull.js?v=20261028-dates"></script>
<script src="person-pull.js?v=20261028-dates"></script>

<script src="episodes.js?v=20261028-dates"></script>

<script>
// ─── Supabase config ──────────────────────────────────────────────────────────


// Compares every field present on `expected` (a backup row) against the
// corresponding field on `restored` (the same row re-fetched after restore).
// Uses exact value equality — no null/undefined normalization — per-field,
// so key order in the two objects is irrelevant (we iterate expected's own
// keys and look up the same key on restored, rather than comparing the

// ─── Curated universe lists ────────────────────────────────────────────────────
// Hand-maintained since there's no single TMDB field for "is this part of the MCU".
// To refresh: ask Claude to check for newly announced/released MCU films and update this list.


// ─── TMDB config ──────────────────────────────────────────────────────────────




// ─── State ────────────────────────────────────────────────────────────────────
let activeMediaType = 'tv'; // 'tv' | 'movie' — controls which views are visible (the last TV / Movies area, also while Collections or Settings is open)
let activeArea = 'tv'; // S2: 'tv' | 'movie' | 'collections' | 'settings' — the primary area shown as current; set only by switchView (tabs.js areaOfView)
let activeViewId = 'watching'; // the open view (derived or browse)
let tabData = {}; // per-run caches by name: tabData.films = the movie tools' films (library.js); no storage
let libraryGovernance = { shows: new Map(), films: new Map(), kinds: new Map(), knownShows: new Set(), knownItems: new Set(), seq: 0 }; // the newest catalog-governance snapshot (library.js)
let stage5Phase = null; // the database's phase from stage5_capabilities(); this page writes only in 'contracted-ep1' (null: not read yet, or any other phase)
let derivedData = null; // { rows, loaded } — cross-TV rows for the derived views, kept apart from tabData
let derivedLoadSeq = 0; // lets a late derived-view load see that it's been superseded
let derivedSectionOpen = { uptodate: true, tba: false, alltvTba: false }; // collapsible sections in the derived views (Up to date starts open, TBA sections closed)
let allTvPresentation = 'shows'; // All TV: 'shows' | 'seasons'; remembered on this device (derived-views.js)
let allTvSeasonVis = 'notskipped'; // All TV Seasons: 'notskipped' (All (except Skipped), the default) | 'all' | 'towatch' | 'watched' | 'skipped'; kept across Shows/Seasons, reset when the view is entered
let addOpen = false;
let tmdbSelectedShow = null; // { id, name } — currently previewed TMDB show
let tmdbShowSpecials = false;
let expandedShows = new Set(); // expanded shows (show ids) in the views
let tvShowsById = new Map(); // tv_shows rows by id: a TV season's status is its show's (tv-shows.js)
let browseData = null; // { rows, dest, members, loaded } — All Movies' or a collection's read (browse-views.js; shows are in tvShowsById since S3), kept apart from tabData and derivedData
let collectionLookups = new Map(); // TMDB collection id → { status: 'loading' | 'failed' | 'ready', parts, error, promise }: what each film collection holds, this page only (collections-pull.js)
let browseLoadSeq = 0; // lets a late browse-view load see that it's been superseded
let browseMedia = 'all'; // a collection's media choice: 'all' | 'tv' | 'movie'; All media on every entry
let browsePresentation = 'shows'; // a collection's TV presentation: 'shows' | 'seasons'; remembered per collection on this device (browse-views.js)
let browseGrouping = 'separate'; // a collection's grouping: 'separate' | 'combined'; remembered per collection on this device
let browseSeasonVis = 'notskipped'; // TV seasons (Seasons only): 'notskipped' (All (except Skipped)) | 'all' | 'towatch' | 'watched' | 'skipped'; All (except Skipped) on every entry, never stored
let browseSectionOpen = {}; // a collection's TBA / Date needs review sections (BROWSE_SECTION_DEFAULTS on every entry)
let browseOrigin = null; // where Back returns from a collection: { mediaType, viewId, filters }; kept while the Collections area is open
let collectionEntry = null; // S2: how the open collection was entered: { viewId, kind: 'remembered' | 'default' | 'fallback' | 'tab' | 'return' } (browse-views.js); a reread keeps it
let nextCollectionEntryKind = null; // the kind the next collection entry takes (set just before it; 'tab' when none)
let lastCollectionVisit = { known: false, id: null, diverged: false }; // S2 (O2): this visit's memory of the remembered collection; diverged = a save or removal failed, so it wins over storage (browse-views.js)
let backNavFilters = null; // { view, values }: filters Back puts back on the view it returns to
let settingsOrigin = null; // where Settings' "Back to library" returns: { mediaType, viewId, filters, browseOrigin } (tabs.js); null when none
let filterPanelOpen = false; // B10: the More filters panel of the open view's visit is open (render.js filterPanelStart; never stored)
let viewFilterMemory = { tag: null, values: {} }; // the open derived or browse view's filter values for this visit, including controls its current mode hides (browse-views.js)
let personalCollections = null; // personal_collections rows (organization.js); null until loaded
let watchWithChoices = null; // watch_with_choices rows; null until loaded (the configured list is offered meanwhile)
let orgState = 'loading'; // 'loading' | 'ready' | 'unavailable' (failed: Retry) | 'absent' (database without personal collections)
let orgLoadSeq = 0; // the latest organization load (its failure matters only if it is still the latest)
let orgReadSeq = 0; // every read of the organization tables takes the next number when it starts (with a read stamp, write-lane.js)
let orgCollectionsSeq = 0; // the start number of the read whose collections are shown (an older read never replaces them)
let orgChoicesSeq = 0; // the same for the watch-with choices
let watchWithState = 'loading'; // 'loading' | 'ready' | 'unavailable' (failed: Retry) | 'absent' (database without watch-with choices)
let orgCollectionsStale = 0; // the read number of a failed refresh newer than the collections shown (0: not stale); a newer published read clears it
let orgChoicesStale = 0; // the same for the watch-with choices
let orgOpSeq = 0; // every organization change the Manage dialog sends takes the next number
let manageSession = 0; // bumped each time the Manage dialog opens; replies for an earlier opening never touch it
let manage = null; // the open Manage dialog's state (organization-manage.js); null while closed
let detailsDialog = null; // the open Details dialog (render.js): its session, snapshot, draft and whether a restore ran since; null while closed
let detailsSessionSeq = 0; // bumped at each opening; an answer for an earlier opening never touches a newer one
let resumePickerFor = null; // the show whose "Watch earlier seasons" picker is open (tv-shows.js); null while none is
let shownNewRecords = []; // the New-from-catalog records the open view shows: [{ kind, id }] (Dismiss all, tv-shows.js)
let cuModal = null; // item 4: the open collection-updates dialog (review, rules, brief, setup, results; collection-updates.js, collection-settings.js); null while closed
let cuLastState = null; // item 4: the newest collection-updates state this page read (cuReadState), for Settings' status line without a read; null until read
let cuShowSettings = new Map(); // item 4: per-show update settings read with each view: show id → { follow_when_skipped, new_season_after_ended_at } (collection-updates.js)
let libraryPanel = null; // the open "+ Add" panel of a view (library.js); null while closed
let libraryPanelSeq = 0; // bumped each time the panel opens; answers for an earlier opening never touch it
let orgWriteCapability = null; // { value: 'yes' }: this database has the Stage 3b-2 functions (checked when Manage opens)
let orgEpoch = 0; // S4: bumped by a restore made in this page (organization.js invalidateOrganization); a membership change or its Undo checks it before sending
let addPicker = null; // S5: the open Add to <collection> picker (collection-members.js); null while closed
let addBatch = null; // S5: this collection visit's latest Add or Undo batch (its results, notice and Undo); null when none
let addPickerSeq = 0; // S5: bumped each time the picker opens
let pullPreselect = null; // S5: { viewId, ids }: the films the last Pull rest in a collection added (its report's follow-up)
let routeEntry = 0; // S6: the number of the history entry shown (history.js); kept in each entry's state
let routeMemory = new Map(); // S6: page memory of the entries this page has shown: number → { viewId, filters, visit state } (D15; never stored)
let routeNavMode = null; // S6: how the next switchView records its route: null (push), 'replace', 'none' (a traversal already on its entry)
let pageShowEpoch = 0; // S6: bumped when the page comes back from the back/forward cache (history.js); a membership answer from before it changes nothing
let browseLayoutPending = false; // S6: a collection opened by its route before the collections were read takes its remembered layout once read
let collectionUndo = null; // S4: the open collection's Undo after a confirmed Remove: { kind, id, title, name, collectionId, viewId, epoch }; withdrawn on leaving the view or a restore
let removeNotice = null; // S4: the open collection's Remove notice { text, withUndo }, drawn with the Add notice (collection-members.js renderCollectionBanner)
let matchRequestSeq = 0; // every Match call takes the next number (tmdb-match.js)
let episodeMarks = new Map(); // EP1: the owner's episode marks, read with each view: season id → Map(TMDB episode id → { id, episode_number }) (episodes.js)
let episodePanel = null; // EP1: the one open episode list: { seasonId, seq, status: 'loading' | 'ready' | 'error', episodes, error, titles, throughId, throughNote }; page memory only
let episodeTitlesChoice = null; // EP2: this page's "Show episode titles by default" choice once made here: { on, saved }; null: the stored choice (else off)
let episodePanelSeq = 0; // EP1: bumped each time an episode list is loaded; a late TMDB answer for an earlier one changes nothing
let showRatingCache = null; // item 2: TMDB show scores from this device's cache for this account (show-ratings.js); read once signed in
let showRatingRequests = new Set(); // item 2: TMDB show ids whose score this page has requested (one request per show per page)





// ─── TMDB: Search ─────────────────────────────────────────────────────────────






// Full reset after a successful add: unlike cancelTMDBPreview (which intentionally
// keeps the results list visible so the user can pick a different match), this
// clears everything — preview, results list, and the search box — since the task
// that produced those results is now done.



// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────
// ─── Pull entire collection (available anytime from any movie row) ───────────


// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────

// ─── Movies: Refresh tracked collections/franchises ───────────────────────────


// ─── Curated universe pull (MCU, and any future hand-maintained universes) ────



// ─── Person-based collections (director/actor filmographies) ─────────────────
let personCollectionPromptOpen = false;
let personCollectionNames = null; // custom_collections names: null = not loaded, a Promise while loading, then a Set











// Refresh a person-linked custom collection (called from the Collections filter area)




// ─── Restore flow ───────────────────────────────────────────────────────────
let pendingRestoreData = null; // validated backup object, set once file passes checks
let pendingRestoreAllowV1Reset = false; // true when a format-1 backup is restored into a format-2 database
let pendingRestoreDbFormat = null; // the database's backup format the restore preview checked against (backup-restore.js)
let restoreSessionSeq = 0; // the restore being prepared; navigation bumps it (backup-restore.js)
let restoreInFlight = false; // restore_backup has been sent: navigation no longer abandons the restore
let pendingSafetyBackup = null; // M1: { filename, doc }: the safety backup just downloaded, for comparing after a restore with no answer


// ─── Boot ────────────────────────────────────────────────────────────────────
// M1: nothing is read until a signed-in user is bound and the database is in the signed-in
// state (auth.js bootAuth); then the library starts as before.
bootAuth(cap => {
  const startView = startupView(); // S6 (D12): the route in the address, else Currently Watching
  buildMediaSwitch();
  buildTabs();
  switchView(startView);
  routeNavMode = null;
  updateBackupAgeIndicator();
  loadOrganization(); // the Browse collections selector and watch-with choices; doesn't hold up the first view
  loadStage5Capabilities(cap); // which backup format this database takes (read by the sign-in boot)
});
</script>
