<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist Tracker</title>
<link rel="stylesheet" href="styles.css?v=20261008-library1">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📺</div>
    <div><div class="logo-text">Watchlist Tracker</div></div>
  </div>
  <div class="topbar-right">
    <span class="backup-age" id="backupAgeIndicator"></span>
    <button class="btn" id="backupBtn" onclick="handleBackupClick()">⬇ Backup</button>
    <button class="btn" id="restoreBtn" onclick="handleRestoreClick()">⬆ Restore</button>
    <input type="file" id="restoreFileInput" accept="application/json" style="display:none" onchange="handleRestoreFileSelected(event)">
    <span class="save-status" id="saveStatus">Saved ✓</span>
  </div>
</div>

<div id="restoreModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="restoreModalBox"></div>
</div>

<div id="manageModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="manageModalBox" role="dialog" aria-modal="true" aria-labelledby="manageTitle" tabindex="-1" onkeydown="manageKeydown(event)"></div>
</div>
<div id="catalogModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box manage-box" id="catalogModalBox" role="dialog" aria-modal="true" aria-labelledby="catalogTitle" tabindex="-1" onkeydown="catalogKeydown(event)"></div>
</div>

<div class="media-switch" id="mediaSwitch"></div>

<div class="tabs" id="tabBar"></div>

<div class="browse-bar" id="browseBar"></div>

<div class="main">
  <div id="noticeBanner"></div>
  <div id="banner"></div>
  <div id="errorBanner"></div>
  <div id="viewHead"></div>
  <div class="stats-row" id="statsRow"></div>

  <div class="filters" id="filtersRow"></div>

  <div id="tmdbPanel" class="tmdb-panel" style="display:none"></div>
  <div id="libraryPanel" class="tmdb-panel library-panel" style="display:none"></div>

  <table id="desktopTable">
    <thead id="tableHead">
      <tr>
        <th>Show &amp; Season</th>
        <th>Theme</th>
        <th>Premiere</th>
        <th>Status</th>
        <th>Watched</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="cardList" class="card-list"></div>

  <div class="add-form" id="addForm" style="display:none">
    <div class="add-form-title">Add a new entry</div>
    <div class="add-form-grid" id="addFormGrid"></div>
  </div>
</div>

<!-- Cache-busting: GitHub Pages caches files for 10 minutes. A ?v= token makes this
     page fetch fresh copies of files that must match it. When a deployment changes
     one of these files in a way the page depends on, bump its token. config.js is
     deliberately unversioned (the catalog-refresh workflow reloads it by plain URL). -->
<script src="config.js"></script>
<script src="identity.js"></script>
<script src="api.js?v=20261008-library1"></script>
<script src="ui-helpers.js"></script>
<script src="backup-restore.js?v=20261008-library1"></script>
<script src="tabs.js?v=20261008-library1"></script>
<script src="render.js?v=20261008-library1"></script>
<script src="row-actions.js?v=20261008-library1"></script>
<script src="tmdb-search.js?v=20261008-library1"></script>
<script src="collections-pull.js?v=20261008-library1"></script>
<script src="universe-pull.js?v=20261008-library1"></script>
<script src="person-pull.js?v=20261008-library1"></script>
<script src="refresh-shows.js?v=20261008-library1"></script>
<script src="tmdb-match.js?v=20261008-library1"></script>
<script src="derived-views.js?v=20261008-library1"></script>
<script src="tv-shows.js?v=20261008-library1"></script>
<script src="organization.js?v=20261008-library1"></script>
<script src="organization-manage.js?v=20261008-library1"></script>
<script src="catalog-apply.js?v=20261008-library1"></script>
<script src="browse-views.js?v=20261008-library1"></script>
<script src="library.js?v=20261008-library1"></script>
<script>

let orgLoadSeq = 0; // the latest organization load (its failure matters only if it is still the latest)
let orgReadSeq = 0; // every read of the organization tables takes the next number when it starts
let orgCollectionsSeq = 0; // the start number of the read whose collections are shown (an older read never replaces them)
let orgChoicesSeq = 0; // the same for the watch-with choices
let orgEpoch = 0; // bumped by a restore: reads started before it never publish
let watchWithState = 'loading'; // 'loading' | 'ready' | 'unavailable' (failed: Retry) | 'absent' (database without watch-with choices)
let orgWriteBarrier = 0; // organization reads started at or before this number never publish (set after a confirmed change; organization-manage.js)
let orgCollectionsStale = 0; // the read number of a failed refresh newer than the collections shown (0: not stale); a newer published read clears it
let orgChoicesStale = 0; // the same for the watch-with choices
let orgOpSeq = 0; // every organization change the Manage dialog sends takes the next number
let manageSession = 0; // bumped each time the Manage dialog opens; replies for an earlier opening never touch it
let manage = null; // the open Manage dialog's state (organization-manage.js); null while closed
let catalogDialog = null; // the open Catalog updates dialog (catalog-apply.js); null while closed
let catalogSession = 0; // bumped each time it opens; answers for an earlier opening never touch it
let catalogChooser = null; // the open Catalog updates chooser (catalog-apply.js): { session, hints }; null while closed
let libraryPanel = null; // the open "+ Add" panel of a view (library.js); null while closed
let libraryPanelSeq = 0; // bumped each time the panel opens; answers for an earlier opening never touch it
let orgWriteCapability = null; // { value: 'yes', epoch }: this database has the Stage 3b-2 functions (checked when Manage opens)
let matchRequestSeq = 0; // every Match call takes the next number (tmdb-match.js)
let matchLatestByRow = {}; // row id → the latest Match call's number for that row
let matchRefreshSeq = 0; // the latest refresh after a Match whose result couldn't be put into the page
let matchRefreshStamp = null; // what that refresh is for (Retry reads it again)
let matchRefreshProgress = null; // the refresh after Matches: its outcomes and its open obligations (rows, shows) (tmdb-match.js)
let matchReadSeq = 0; // every tracked read (tab, row, shows) and every Match call takes the next number when it starts
let matchReads = []; // recent tracked reads with their epoch and outcome; any of them can satisfy a refresh obligation
let matchPublished = { epoch: 0, tabs: {}, rows: {}, shows: {} }; // newest read that published each tab, row and show list (per restore epoch)





// ─── TMDB: Search ─────────────────────────────────────────────────────────────






// Full reset after a successful add: unlike cancelTMDBPreview (which intentionally
// keeps the results list visible so the user can pick a different match), this
// clears everything — preview, results list, and the search box — since the task
// that produced those results is now done.

// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────

// ─── Curated universe pull (MCU, and any future hand-maintained universes) ────



// ─── Person-based collections (director/actor filmographies) ─────────────────
let personCollectionPromptOpen = false;
let personCollectionNames = null; // custom_collections names: null = not loaded, a Promise while loading, then a Set











// Refresh a person-linked custom collection (called from the Collections filter area)




// ─── Restore flow ───────────────────────────────────────────────────────────
let pendingRestoreData = null; // validated backup object, set once file passes checks
let pendingRestoreAllowV1Reset = false; // true when a format-1 backup is restored into a format-2 database
let restoreSessionSeq = 0; // the restore being prepared; navigation bumps it (backup-restore.js)
let restoreInFlight = false; // restore_backup has been sent: navigation no longer abandons the restore


// ─── Boot ────────────────────────────────────────────────────────────────────
buildMediaSwitch();
buildTabs();
switchView(activeViewId);
updateBackupAgeIndicator();
loadOrganization(); // the Browse collections selector and watch-with choices; doesn't hold up the first view

</body>
</html>
