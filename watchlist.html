<script>
// ─── Supabase config ──────────────────────────────────────────────────────────


// Compares every field present on `expected` (a backup row) against the
// corresponding field on `restored` (the same row re-fetched after restore).
// Uses exact value equality — no null/undefined normalization — per-field,
// so key order in the two objects is irrelevant (we iterate expected's own
// keys and look up the same key on restored, rather than comparing the
// objects as a whole). Returns an array of field names that differ.
function compareRowFields(expected, restored) {
  const diffFields = [];
  for (const key of Object.keys(expected)) {
    const a = expected[key];
    const b = restored[key];
    // JSON.stringify on a single value (not a whole object) is safe here —
    // it has no key-order ambiguity for primitives, and for arrays
    // (watch_with, collections) it correctly catches real order/content
    // differences, which are genuine data differences, not false positives.
    if (JSON.stringify(a) !== JSON.stringify(b)) {
      diffFields.push(key);
    }
  }
  return diffFields;
}

const RESTORE_BATCH_SIZE = 200;

// Fetches all rows from all three app tables and assembles the backup JSON object.
// Does not write anything — pure read + build.
async function buildBackupObject() {
  const tables = {};
  const rowCounts = {};
  for (const table of BACKUP_TABLES) {
    const rows = await fetchAllRows(table);
    tables[table] = rows;
    rowCounts[table] = rows.length;
  }
  return {
    format: BACKUP_FORMAT,
    formatVersion: BACKUP_FORMAT_VERSION,
    exportedAt: new Date().toISOString(),
    rowCounts,
    tables
  };
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function timestampForFilename() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}

// Deletes every row in a table. Supabase requires a filter on DELETE (no filter
// = rejected), so we match "id is not null", which is true for every row since
// id is NOT NULL on all three tables.

// ─── Collection definitions ───────────────────────────────────────────────────


// ─── Curated universe lists ────────────────────────────────────────────────────
// Hand-maintained since there's no single TMDB field for "is this part of the MCU".
// To refresh: ask Claude to check for newly announced/released MCU films and update this list.

// ─── State ────────────────────────────────────────────────────────────────────
let activeMediaType = 'tv'; // 'tv' | 'movie' — controls which tabs are visible
let activeTabId = COLLECTIONS.find(c => c.mediaType === 'tv').id;
let tabData = {}; // { [collectionId]: { rows: [], loaded: false, newKeys: [] } }
let addOpen = false;
let tmdbSelectedShow = null; // { id, name } — currently previewed TMDB show
let tmdbShowSpecials = false;
let expandedShows = new Set(); // titles currently expanded on grouped (dynamic) tabs


// ─── Tab bar ──────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tabBar');
  const visibleCollections = COLLECTIONS.filter(c => c.mediaType === activeMediaType);
  bar.innerHTML = visibleCollections.map(c =>
    `<div class="tab${c.id===activeTabId?' active':''}" onclick="switchTab('${c.id}')">
      <span class="tab-icon">${c.icon}</span>${esc(c.label)}
    </div>`
  ).join('');
}

function buildMediaSwitch() {
  const el = document.getElementById('mediaSwitch');
  if (!el) return;
  el.innerHTML = `
    <button class="media-switch-btn${activeMediaType==='tv'?' active':''}" onclick="switchMediaType('tv')">📺 TV</button>
    <button class="media-switch-btn${activeMediaType==='movie'?' active':''}" onclick="switchMediaType('movie')">🎬 Movies</button>
  `;
}

function switchMediaType(type) {
  if (type === activeMediaType) return;
  activeMediaType = type;
  const firstInMode = COLLECTIONS.find(c => c.mediaType === type);
  if (firstInMode) {
    switchTab(firstInMode.id);
  }
  buildMediaSwitch();
}

function switchTab(id) {
  activeTabId = id;
  addOpen = false;
  tmdbSelectedShow = null;
  expandedShows = new Set();
  document.getElementById('addForm').style.display = 'none';
  document.getElementById('banner').innerHTML = '';
  buildTabs();
  const td = tabData[id];
  if (!td || !td.loaded) {
    loadTab(id);
  } else {
    renderFilters();
    renderTable();
  }
}

// ─── Load tab data from Supabase ─────────────────────────────────────────────
async function loadTab(collectionId) {
  // Only show the loading state if this is still the tab the user is looking at —
  // if they've already switched tabs by the time this fires, don't touch the DOM.
  if (activeTabId === collectionId) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="6" class="loading">Loading…</td></tr>`;
    document.getElementById('cardList').innerHTML = `<div class="loading">Loading…</div>`;
    document.getElementById('statsRow').innerHTML = '';
    document.getElementById('filtersRow').innerHTML = '';
    showError('');
  }

  try {
    const rows = await sbFetch('GET',
      `${TABLE}?collection=eq.${encodeURIComponent(collectionId)}&order=date_sort.asc&select=*`,
      null
    );

    const col = COLLECTIONS.find(c => c.id === collectionId);
    const existingKeys = new Set(rows.map(r => r.item_key));
    const toInsert = [];
    const newKeys = [];

    for (const d of col.defaults) {
      if (!existingKeys.has(d.k)) {
        toInsert.push({
          collection: collectionId,
          item_key: d.k,
          title: d.t,
          season: d.s,
          theme: d.th,
          display_date: d.d,
          date_sort: d.ds,
          watched: false,
          status: d.p ? 'pending' : 'confirmed'
        });
        newKeys.push(d.k);
      } else {
        // refresh TBA dates
        const existing = rows.find(r => r.item_key === d.k);
        if (existing && /TBA/i.test(existing.display_date) && !/TBA/i.test(d.d)) {
          await sbFetch('PATCH',
            `${TABLE}?collection=eq.${encodeURIComponent(collectionId)}&item_key=eq.${encodeURIComponent(d.k)}`,
            { display_date: d.d, date_sort: d.ds }
          );
          existing.display_date = d.d;
          existing.date_sort = d.ds;
        }
      }
    }

    if (toInsert.length > 0) {
      const inserted = await sbFetch('POST', TABLE, toInsert);
      if (inserted) rows.push(...inserted);
    }

    rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));

    // Always cache the result, even if the user has navigated away — this keeps
    // tabData correct and avoids redundant reloads when they switch back.
    tabData[collectionId] = { rows, loaded: true, newKeys };

    // But only touch the visible DOM if this tab is still the one being viewed.
    if (activeTabId !== collectionId) return;

    if (newKeys.length > 0) {
      document.getElementById('banner').innerHTML =
        `<div class="banner">✦ ${newKeys.length} new entr${newKeys.length===1?'y':'ies'} added.</div>`;
    }

    renderFilters();
    renderTable();
  } catch(e) {
    if (activeTabId !== collectionId) { console.error(e); return; }
    showError(e.message);
    document.getElementById('tbody').innerHTML = `<tr><td colspan="6" class="loading">Failed to load. Check console for details.</td></tr>`;
    document.getElementById('cardList').innerHTML = `<div class="loading">Failed to load. Check console for details.</div>`;
    console.error(e);
  }
}

// ─── Filters ──────────────────────────────────────────────────────────────────
function renderFilters() {
  const col = COLLECTIONS.find(c => c.id === activeTabId);
  const td = tabData[activeTabId];

  let themeList = col.themes;
  let yearList  = col.years;
  if (col.dynamic && td) {
    themeList = [...new Set(td.rows.map(r => r.theme).filter(Boolean))].sort();
    yearList  = [...new Set(td.rows.map(r => r.date_sort.substring(0,4)))].sort();
  }

  const themeOpts = themeList.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  const yearOpts  = yearList.map(y => `<option value="${y}">${y}</option>`).join('');

  let collectionsFilterHtml = '';
  let watchWithFilterHtml = '';
  if (col.isMovieTab && td) {
    const collectionSet = new Set();
    td.rows.forEach(r => (r.collections || []).forEach(c => collectionSet.add(cleanCollectionName(c))));
    const collectionList = [...collectionSet].sort();
    if (collectionList.length > 0) {
      const collectionOpts = collectionList.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      collectionsFilterHtml = `
      <select id="fCollection" onchange="renderTable(); updateCollectionRefreshLink();">
        <option value="">All collections</option>${collectionOpts}
      </select>
      <span id="collectionRefreshLink"></span>`;
    }
    const watchWithOpts = WATCH_WITH_OPTIONS.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
    watchWithFilterHtml = `
      <select id="fWatchWith" onchange="renderTable()">
        <option value="">Watch with: anyone</option>${watchWithOpts}
      </select>`;
  }

  document.getElementById('filtersRow').innerHTML = `
    <button class="filter-toggle-btn" onclick="toggleFilters()" id="filterToggleBtn">
      <span>🔍 Search &amp; Filter</span><span id="filterToggleChevron">▾</span>
    </button>
    <div class="filters-inner">
      <span class="filter-label">Filter:</span>
      <input class="search-input" id="fSearch" type="text" placeholder="Search titles…" oninput="renderTable()">
      <select id="fTheme" onchange="renderTable()">
        <option value="">All themes</option>${themeOpts}
      </select>
      <select id="fYear" onchange="renderTable()">
        <option value="">All years</option>${yearOpts}
      </select>
      ${collectionsFilterHtml}
      ${watchWithFilterHtml}
      <select id="fWatch" onchange="renderTable()">
        <option value="">All statuses</option>
        <option value="unwatched" selected>Not watched</option>
        <option value="watched">Watched</option>
      </select>
      <select id="fStatus" onchange="renderTable()">
        <option value="">All (except Skipped)</option>
        <option value="confirmed">On list only</option>
        <option value="highpriority">High Priority only</option>
        <option value="watching">Watching only</option>
        <option value="caughtup">Caught Up only</option>
        <option value="complete">Complete only</option>
        <option value="pending">Pending only</option>
        <option value="maybe">Maybe Later only</option>
        <option value="skipped">Skipped</option>
      </select>
      <button class="btn" onclick="toggleAdd()" id="addToggleBtn">+ Add entry</button>
    </div>
  `;
  // start collapsed on mobile widths
  if (window.innerWidth <= 700) {
    document.getElementById('filtersRow').classList.add('collapsed');
  }

  // build add form (dynamic tabs use free-text network field instead of fixed theme list)
  const themeFieldHtml = col.dynamic
    ? `<input id="nTheme" type="text" placeholder="e.g. HBO, Netflix">`
    : `<select id="nTheme">${col.themes.map(t => `<option>${esc(t)}</option>`).join('')}</select>`;
  document.getElementById('addFormGrid').innerHTML = `
    <div><label>Title</label><input id="nTitle" type="text" placeholder="Show title"></div>
    <div><label>Season</label><input id="nSeason" type="text" value="Season 1"></div>
    <div><label>${col.dynamic?'Network':'Theme'}</label>${themeFieldHtml}</div>
    <div><label>Premiere date</label><input id="nDate" type="text" placeholder="e.g. Jan 12, 2014"></div>
    <button class="btn btn-accent" onclick="addEntry()" style="margin-bottom:0">Add</button>
  `;

  // TMDB search panel (dynamic tabs only)
  const tmdbPanel = document.getElementById('tmdbPanel');
  if (col.dynamic) {
    tmdbPanel.style.display = 'block';
    if (col.isMovieTab) {
      tmdbPanel.innerHTML = `
        <div class="tmdb-search-row">
          <input id="tmdbQuery" type="text" placeholder="Search for a movie…" onkeydown="if(event.key==='Enter'){searchTMDB();}">
          <button class="btn btn-accent" onclick="searchTMDB()">Search</button>
          <button class="btn" onclick="refreshCollections()" title="Check your tracked collections/franchises for movies you haven't added yet">↻ Refresh collections</button>
        </div>
        <div class="tmdb-universe-row">
          <button class="universe-link" onclick="pullUniverse('mcu')">+ pull entire MCU</button>
          <span class="universe-sep">·</span>
          <button class="universe-link" onclick="togglePersonCollectionPrompt()">+ start a person collection</button>
        </div>
        <div id="personCollectionPrompt" style="display:none"></div>
        <div id="tmdbResults"></div>
        <div id="tmdbPreview"></div>
      `;
    } else {
      tmdbPanel.innerHTML = `
        <div class="tmdb-search-row">
          <input id="tmdbQuery" type="text" placeholder="Search for a show…" onkeydown="if(event.key==='Enter'){searchTMDB();}">
          <button class="btn btn-accent" onclick="searchTMDB()">Search</button>
          <button class="btn" onclick="refreshShows()" title="Check for new seasons of shows already on this list">↻ Refresh shows</button>
        </div>
        <div id="tmdbResults"></div>
        <div id="tmdbPreview"></div>
      `;
    }
  } else {
    tmdbPanel.style.display = 'none';
    tmdbPanel.innerHTML = '';
  }
}

// ─── Render table ─────────────────────────────────────────────────────────────
function renderTable() {
  const td = tabData[activeTabId];
  if (!td) return;
  const col = COLLECTIONS.find(c => c.id === activeTabId);

  const fSearch = document.getElementById('fSearch')?.value.trim().toLowerCase() || '';
  const fTheme  = document.getElementById('fTheme')?.value  || '';
  const fYear   = document.getElementById('fYear')?.value   || '';
  const fCollection = document.getElementById('fCollection')?.value || '';
  const fWatchWith = document.getElementById('fWatchWith')?.value || '';
  const fWatch  = document.getElementById('fWatch')?.value  || '';
  const fStatus = document.getElementById('fStatus')?.value || '';

  let list = [...td.rows].sort((a,b) => a.date_sort.localeCompare(b.date_sort));

  if (fStatus === 'caughtup') {
    // "Caught Up" is a derived, show-level status — never stored on an individual
    // row. At the row level we pass through the same rows as "Watching" and let
    // the grouped renderer split Watching vs. Caught Up by derived aggStatus.
    list = list.filter(r => r.status === 'watching');
  } else if (fStatus) {
    list = list.filter(r => r.status === fStatus);
  } else {
    list = list.filter(r => r.status !== 'skipped');
  }

  if (fSearch) list = list.filter(r => r.title.toLowerCase().includes(fSearch));
  if (fTheme) list = list.filter(r => r.theme === fTheme);
  if (fYear)  list = list.filter(r => r.date_sort.startsWith(fYear));
  if (fCollection) list = list.filter(r => (r.collections || []).some(c => cleanCollectionName(c) === fCollection));
  if (fWatchWith) list = list.filter(r => (r.watch_with || []).includes(fWatchWith));

  // statsList mirrors list's theme/year/status/search scope, but ignores the
  // watched/unwatched filter — stats should reflect real progress, not be
  // zeroed out just because the table is currently showing only unwatched rows.
  const statsList = list;

  if (fWatch === 'watched')   list = list.filter(r => r.watched);
  if (fWatch === 'unwatched') list = list.filter(r => !r.watched);

  const trackable = statsList.filter(r => r.status !== 'skipped');
  const watched   = trackable.filter(r => r.watched).length;
  const total     = trackable.length;
  const pct       = total > 0 ? Math.round(watched/total*100) : 0;
  const pending   = statsList.filter(r => r.status === 'pending').length;
  const maybe     = statsList.filter(r => r.status === 'maybe').length;
  const watching     = statsList.filter(r => r.status === 'watching').length;
  const highPriority = statsList.filter(r => r.status === 'highpriority').length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">On List</div></div>
    <div class="stat"><div class="stat-num">${watched}</div><div class="stat-label">Watched</div></div>
    <div class="stat"><div class="stat-num">${total-watched}</div><div class="stat-label">To Watch</div></div>
    <div class="stat">
      <div class="stat-num">${pct}%</div><div class="stat-label">Complete</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${watching>0?`<div class="stat"><div class="stat-num">${watching}</div><div class="stat-label">Watching</div></div>`:''}
    ${highPriority>0?`<div class="stat"><div class="stat-num">${highPriority}</div><div class="stat-label">High Priority</div></div>`:''}
    ${pending>0?`<div class="stat"><div class="stat-num">${pending}</div><div class="stat-label">Pending</div></div>`:''}
    ${maybe>0?`<div class="stat"><div class="stat-num">${maybe}</div><div class="stat-label">Maybe Later</div></div>`:''}
  `;

  if (list.length === 0) {
    const colCount = col.isMovieTab ? 9 : 6;
    document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="${colCount}">No entries match your filters.</td></tr>`;
    document.getElementById('cardList').innerHTML = '<div class="empty-row" style="padding:2rem 0">No entries match your filters.</div>';
    return;
  }

  updateTableHeader(col);

  if (col.dynamic && !col.isMovieTab) {
    renderGroupedTable(list, td, fStatus);
  } else if (col.isMovieTab) {
    renderMoviesTable(list, td);
  } else {
    renderFlatTable(list, td);
  }
}

function updateTableHeader(col) {
  const thead = document.getElementById('tableHead');
  if (!thead) return;
  if (col.isMovieTab) {
    thead.innerHTML = `
      <tr>
        <th>Title</th>
        <th>Genre</th>
        <th>Collection</th>
        <th>Watch With</th>
        <th>Release Date</th>
        <th>Status</th>
        <th>Watched</th>
        <th></th>
        <th></th>
      </tr>`;
  } else {
    thead.innerHTML = `
      <tr>
        <th>Show &amp; Season</th>
        <th>Theme</th>
        <th>Premiere</th>
        <th>Status</th>
        <th>Watched</th>
        <th></th>
      </tr>`;
  }
}

// ─── Flat rendering (Disney+, 90 Day, Sheridan) ───────────────────────────────
function renderFlatTable(list, td) {
  let html = '', cardHtml = '', lastYear = '';
  list.forEach(r => {
    const yr = r.date_sort.substring(0,4);
    if (yr !== lastYear) {
      html += `<tr class="year-group"><td colspan="6">${yr}</td></tr>`;
      cardHtml += `<div class="card-year-group">${yr}</div>`;
      lastYear = yr;
    }
    const isNew = td.newKeys.includes(r.item_key);
    const bc = badgeClass(r.theme);
    const isSkipped = r.status === 'skipped';
    const isMaybe   = r.status === 'maybe';
    const statusClass = `s-${r.status}`;
    const statusOptions = statusOptionsHtml(r.status);
    const statusCell = `<select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptions}</select>`;
    const rowClass = isSkipped?'row-skipped':isMaybe?'row-maybe':'';

    html += `<tr class="${rowClass}">
      <td>
        <span class="show-title">${esc(r.title)}</span>
        <span class="season-lbl"> · ${esc(r.season)}</span>
        ${isNew?'<span class="new-tag">New</span>':''}
      </td>
      <td><button class="badge ${bc} badge-clickable" onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(r.theme).replace(/'/g,"\\'")}')" title="Filter by this theme">${esc(r.theme)}</button></td>
      <td class="date-cell">${esc(r.display_date)}</td>
      <td>${statusCell}</td>
      <td>${!isSkipped
        ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓ Watched':'Mark watched'}</button>`
        : `<span class="confirmed-lbl">—</span>`
      }</td>
      <td><button class="del-btn" onclick="delRow('${r.id}')" title="Remove">×</button></td>
    </tr>`;

    cardHtml += `<div class="item-card ${rowClass}">
      <div class="card-top">
        <div class="card-title-block">
          <span class="card-title">${esc(r.title)}</span>
          <span class="card-season">${esc(r.season)}</span>
          ${isNew?'<span class="new-tag">New</span>':''}
        </div>
        <button class="card-del-btn" onclick="delRow('${r.id}')" title="Remove">×</button>
      </div>
      <div class="card-meta">
        <button class="badge ${bc} badge-clickable" onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(r.theme).replace(/'/g,"\\'")}')" title="Filter by this theme">${esc(r.theme)}</button>
        <span class="card-date">${esc(r.display_date)}</span>
      </div>
      <div class="card-actions">
        <select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptions}</select>
        ${!isSkipped
          ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓ Watched':'Mark watched'}</button>`
          : ''
        }
      </div>
    </div>`;
  });
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('cardList').innerHTML = cardHtml;
}

// ─── Movies rendering (standalone films, with Watch With + Collections tags) ──
function watchWithPickerHtml(rowId, current) {
  current = current || [];
  return WATCH_WITH_OPTIONS.map(opt => {
    const checked = current.includes(opt) ? 'checked' : '';
    return `<label class="ww-option"><input type="checkbox" value="${esc(opt)}" ${checked} onchange="toggleWatchWith('${rowId}', '${esc(opt).replace(/'/g,"\\'")}', this.checked)"> ${esc(opt)}</label>`;
  }).join('');
}

function renderMoviesTable(list, td) {
  let html = '', cardHtml = '';
  list.forEach(r => {
    const isNew = td.newKeys.includes(r.item_key);
    const genreBadgeStyle = networkBadgeStyle(r.theme);
    const isSkipped = r.status === 'skipped';
    const isMaybe   = r.status === 'maybe';
    const statusClass = `s-${r.status}`;
    const statusOptions = statusOptionsHtml(r.status);
    const statusCell = `<select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptions}</select>`;
    const rowClass = isSkipped?'row-skipped':isMaybe?'row-maybe':'';

    const watchWith = r.watch_with || [];
    const collections = (r.collections || []).map(cleanCollectionName);
    const collectionTagsHtml = collections.map(c => `<button class="collection-tag collection-tag-clickable" onclick="event.stopPropagation(); toggleCollectionFilterFromTag('${esc(c).replace(/'/g,"\\'")}')" title="Filter by this collection">${esc(c)}</button>`).join('');
    const watchWithTagsHtml = watchWith.map(w => `<button class="ww-tag ww-tag-clickable" onclick="event.stopPropagation(); toggleWatchWithFilterFromTag('${esc(w).replace(/'/g,"\\'")}')" title="Filter by this person">${esc(w)}</button>`).join('');
    // mobile card view keeps tags combined near the title — no column grid to align there anyway
    const inlineTagsHtml = collectionTagsHtml + watchWithTagsHtml;
    const cleanCollectionDisplayName = cleanCollectionName(r.tmdb_collection_name || '');
    const pullBtnHtml = r.tmdb_collection_id
      ? `<button class="popover-action" onclick="openPullCollection('${r.id}', ${r.tmdb_collection_id}, '${esc(cleanCollectionDisplayName).replace(/'/g,"\\'")}')">🔗 Pull rest of ${esc(cleanCollectionDisplayName||'collection')}</button>`
      : '';

    const morePopover = `
      <div class="more-popover" id="more-popover-${r.id}" style="display:none">
        <div class="popover-section-label">Watch with</div>
        <div class="ww-options-grid">${watchWithPickerHtml(r.id, watchWith)}</div>
        ${pullBtnHtml ? `<div class="popover-section-label" style="margin-top:8px">Collection</div>${pullBtnHtml}` : ''}
      </div>`;

    html += `<tr class="${rowClass} movie-row-condensed">
      <td>
        <span class="show-title">${esc(r.title)}</span>
        ${isNew?'<span class="new-tag">New</span>':''}
      </td>
      <td><button class="badge badge-clickable" ${genreBadgeStyle} onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(r.theme).replace(/'/g,"\\'")}')" title="Filter by this genre">${esc(r.theme)}</button></td>
      <td class="tags-cell">${collectionTagsHtml || '<span class="tags-empty">—</span>'}</td>
      <td class="tags-cell">${watchWithTagsHtml || '<span class="tags-empty">—</span>'}</td>
      <td class="date-cell">${esc(r.display_date)}</td>
      <td>${statusCell}</td>
      <td>${!isSkipped
        ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓ Watched':'Mark watched'}</button>`
        : `<span class="confirmed-lbl">—</span>`
      }</td>
      <td class="more-cell">
        <button class="more-btn" onclick="toggleMorePopover('${r.id}')" title="Watch with / collection">⋯</button>
        ${morePopover}
      </td>
      <td><button class="del-btn" onclick="delRow('${r.id}')" title="Remove">×</button></td>
    </tr>`;

    cardHtml += `<div class="item-card ${rowClass} movie-card-condensed">
      <div class="card-top">
        <div class="card-title-block">
          <span class="card-title">${esc(r.title)}</span>
          ${isNew?'<span class="new-tag">New</span>':''}
          ${inlineTagsHtml ? `<div class="inline-tags">${inlineTagsHtml}</div>` : ''}
        </div>
        <div class="card-row-actions">
          <button class="more-btn" onclick="toggleMorePopover('${r.id}')" title="Watch with / collection">⋯</button>
          <button class="card-del-btn" onclick="delRow('${r.id}')" title="Remove">×</button>
        </div>
        ${morePopover}
      </div>
      <div class="card-meta">
        <button class="badge badge-clickable" ${genreBadgeStyle} onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(r.theme).replace(/'/g,"\\'")}')" title="Filter by this genre">${esc(r.theme)}</button>
        <span class="card-date">${esc(r.display_date)}</span>
      </div>
      <div class="card-actions">
        <select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptions}</select>
        ${!isSkipped
          ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓ Watched':'Mark watched'}</button>`
          : ''
        }
      </div>
    </div>`;
  });
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('cardList').innerHTML = cardHtml;
}

function toggleMorePopover(rowId) {
  const el = document.getElementById(`more-popover-${rowId}`);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  // close any other open popovers first
  document.querySelectorAll('.more-popover').forEach(p => p.style.display = 'none');
  el.style.display = isOpen ? 'none' : 'block';
}

// close any open popover when clicking elsewhere on the page
document.addEventListener('click', function(e) {
  if (e.target.closest('.more-popover') || e.target.closest('.more-btn')) return;
  document.querySelectorAll('.more-popover').forEach(p => p.style.display = 'none');
});

async function toggleWatchWith(rowId, tag, checked) {
  const td = tabData[activeTabId];
  const row = td.rows.find(r => r.id === rowId);
  if (!row) return;
  const current = new Set(row.watch_with || []);
  if (checked) current.add(tag); else current.delete(tag);
  const updated = [...current];
  const previous = row.watch_with || [];
  row.watch_with = updated;
  try {
    await sbFetch('PATCH', `${TABLE}?id=eq.${rowId}`, { watch_with: updated });
    showSaved();
    renderTable();
  } catch(e) {
    row.watch_with = previous;
    renderTable();
    showError(e.message);
  }
}

// ─── Grouped rendering (Other TV, True Crime/Docs) ────────────────────────────
function statusOptionsHtml(status) {
  // "Caught Up" is purely derived (see hasWatchableSoonSeason) — never a status the
  // user sets directly. It only appears in this list when it's already the current
  // value (so the dropdown displays it correctly), and it's disabled so re-selecting
  // it can't happen — Supabase should never end up with a literal "caughtup" status.
  const caughtUpOption = status === 'caughtup'
    ? `<option value="caughtup" selected disabled>✓ Caught Up</option>`
    : '';
  return `
    <option value="confirmed"${status==='confirmed'?' selected':''}>✓ On List</option>
    <option value="highpriority"${status==='highpriority'?' selected':''}>⭐ High Priority</option>
    <option value="watching"${status==='watching'?' selected':''}>▶ Watching</option>
    ${caughtUpOption}
    <option value="complete"${status==='complete'?' selected':''}>◆ Complete</option>
    <option value="pending"${status==='pending'?' selected':''}>⏳ Pending</option>
    <option value="maybe"${status==='maybe'?' selected':''}>? Maybe Later</option>
    <option value="skipped"${status==='skipped'?' selected':''}>✕ Skipped</option>
  `;
}

function renderGroupedTable(list, td, fStatus) {
  // Which shows are visible is determined by the filtered `list`.
  // But once a show is visible, its season breakdown/progress/badges should reflect
  // ALL of that show's seasons in Supabase — not just the ones surviving the current filter —
  // otherwise progress counts (e.g. "2/3 watched") get skewed by filters like "Not watched".
  const visibleTitles = new Set(list.map(r => r.title));

  const groups = new Map();
  td.rows.forEach(r => {
    if (!visibleTitles.has(r.title)) return;
    if (!groups.has(r.title)) groups.set(r.title, []);
    groups.get(r.title).push(r);
  });

  // Status priority order for sorting: Watching > Caught Up > High Priority > On List > Complete > Pending > Maybe Later > Skipped
  const statusOrder = ['watching','caughtup','highpriority','confirmed','complete','pending','maybe','skipped'];

  const groupList = [...groups.entries()].map(([title, seasons]) => {
    seasons.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    // aggregate status: earliest-priority status present among this show's seasons
    let aggStatus = 'confirmed';
    for (const s of statusOrder) { if (seasons.some(x => x.status === s)) { aggStatus = s; break; } }
    // derived (not stored): a show sitting at "Watching" with nothing actually
    // watchable soon displays as "Caught Up" instead — purely a display state,
    // the underlying stored status remains "watching" in Supabase.
    if (aggStatus === 'watching' && !hasWatchableSoonSeason(seasons)) {
      aggStatus = 'caughtup';
    }
    return { title, seasons, earliestDate: seasons[0].date_sort, aggStatus };
  });
  groupList.sort((a,b) => {
    const rankDiff = statusOrder.indexOf(a.aggStatus) - statusOrder.indexOf(b.aggStatus);
    if (rankDiff !== 0) return rankDiff;
    return a.earliestDate.localeCompare(b.earliestDate);
  });

  // "Watching" and "Caught Up" are split by the derived aggStatus — a group's real
  // stored status stays "watching" in Supabase either way; only the filtered view differs.
  let visibleGroupList = groupList;
  if (fStatus === 'watching') {
    visibleGroupList = groupList.filter(group => group.aggStatus === 'watching');
  } else if (fStatus === 'caughtup') {
    visibleGroupList = groupList.filter(group => group.aggStatus === 'caughtup');
  }

  let html = '', cardHtml = '';
  visibleGroupList.forEach(group => {
    const { title, seasons, aggStatus } = group;
    const isExpanded = expandedShows.has(title);
    const network = seasons[0].theme || 'Unknown';
    const badgeStyle = networkBadgeStyle(network);
    const trackableSeasons = seasons.filter(s => s.status !== 'skipped');
    const watchedCount = trackableSeasons.filter(s => s.watched).length;
    const totalCount = trackableSeasons.length;
    const anyNew = seasons.some(s => td.newKeys.includes(s.item_key));

    const aggClass = `s-${aggStatus}`;

    const progressPct = totalCount > 0 ? Math.round(watchedCount/totalCount*100) : 0;
    const progressLabel = totalCount > 0 ? `${watchedCount}/${totalCount} watched` : `${seasons.length} season${seasons.length===1?'':'s'}`;
    const progressBarHtml = totalCount > 0
      ? `<div class="mini-progress-track"><div class="mini-progress-fill" style="width:${progressPct}%"></div></div>`
      : '';
    const titleEsc = esc(title).replace(/'/g,"\\'");
    const masterStatusCell = `<select class="status-select ${aggClass}" onclick="event.stopPropagation()" onchange="event.stopPropagation(); setShowStatus('${titleEsc}', this.value)">${statusOptionsHtml(aggStatus)}</select>`;

    const seasonRowsHtml = seasons.map(r => {
      const isSkipped = r.status === 'skipped';
      const isMaybe   = r.status === 'maybe';
      const statusClass = `s-${r.status}`;
      const statusCell = `<select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptionsHtml(r.status)}</select>`;
      const rowClass = isSkipped?'row-skipped':isMaybe?'row-maybe':'';
      return `<tr class="${rowClass} sub-row">
        <td style="padding-left:28px">
          <span class="season-lbl">${esc(r.season)}</span>
          ${td.newKeys.includes(r.item_key)?'<span class="new-tag">New</span>':''}
        </td>
        <td></td>
        <td class="date-cell">${esc(r.display_date)}</td>
        <td>${statusCell}</td>
        <td>${!isSkipped
          ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓ Watched':'Mark watched'}</button>`
          : `<span class="confirmed-lbl">—</span>`
        }</td>
        <td><button class="del-btn" onclick="delRow('${r.id}')" title="Remove">×</button></td>
      </tr>`;
    }).join('');

    html += `<tr class="show-group-row" onclick="toggleShowExpand('${titleEsc}')">
      <td>
        <div class="show-title-row">
          <div class="show-title-left">
            <span class="show-title">${esc(title)}</span>
            ${anyNew?'<span class="new-tag">New</span>':''}
          </div>
          <span class="expand-chevron">${isExpanded?'▾':'▸'}</span>
        </div>
      </td>
      <td><button class="badge badge-clickable" ${badgeStyle} onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(network).replace(/'/g,"\\'")}')" title="Filter by this network">${esc(network)}</button></td>
      <td class="date-cell">${esc(seasons[0].display_date)}</td>
      <td>${masterStatusCell}</td>
      <td class="card-date">${progressLabel}${progressBarHtml}</td>
      <td><span class="confirmed-lbl">—</span></td>
    </tr>`;
    if (isExpanded) html += seasonRowsHtml;

    cardHtml += `<div class="item-card show-group-card">
      <div class="card-top" onclick="toggleShowExpand('${titleEsc}')" style="cursor:pointer">
        <div class="card-title-block">
          <span class="card-title">${esc(title)}</span>
          ${anyNew?'<span class="new-tag">New</span>':''}
        </div>
        <span class="expand-chevron">${isExpanded?'▾':'▸'}</span>
      </div>
      <div class="card-meta">
        <button class="badge badge-clickable" ${badgeStyle} onclick="event.stopPropagation(); toggleThemeFilterFromTag('${esc(network).replace(/'/g,"\\'")}')" title="Filter by this network">${esc(network)}</button>
        <span class="card-date">${esc(seasons[0].display_date)} · ${progressLabel}</span>
        ${progressBarHtml}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        ${masterStatusCell}
      </div>
      ${isExpanded ? `<div class="card-subseasons">${seasons.map(r => {
        const isSkipped = r.status === 'skipped';
        const statusClass = `s-${r.status}`;
        return `<div class="card-subseason-row">
          <span class="card-season">${esc(r.season)} · ${esc(r.display_date)}</span>
          <div class="card-actions">
            <select class="status-select ${statusClass}" onchange="setStatus('${r.id}', this.value, this)">${statusOptionsHtml(r.status)}</select>
            ${!isSkipped
              ? `<button class="watch-btn${r.watched?' watched':''}" onclick="toggleWatch('${r.id}')">${r.watched?'✓':'Mark watched'}</button>`
              : ''
            }
            <button class="card-del-btn" onclick="delRow('${r.id}')" title="Remove">×</button>
          </div>
        </div>`;
      }).join('')}</div>` : ''}
    </div>`;
  });

  const emptyMsg = fStatus === 'caughtup'
    ? `Nothing caught up right now — shows land here once they're marked Watching with no new episodes due in the next 60 days.`
    : fStatus === 'watching'
      ? `Nothing watchable in the next 60 days — check "Caught Up" or "All (except Skipped)" to see everything marked Watching.`
      : `No entries match your filters.`;
  document.getElementById('tbody').innerHTML = html || `<tr class="empty-row"><td colspan="6">${emptyMsg}</td></tr>`;
  document.getElementById('cardList').innerHTML = cardHtml || `<div class="empty-row" style="padding:2rem 0">${emptyMsg}</div>`;
}

function toggleShowExpand(title) {
  if (expandedShows.has(title)) expandedShows.delete(title);
  else expandedShows.add(title);
  renderTable();
}

async function setShowStatus(title, status) {
  const td = tabData[activeTabId];
  if (!td) return;
  const rows = td.rows.filter(r => r.title === title);
  if (rows.length === 0) return;

  const previousStatuses = rows.map(r => r.status);
  rows.forEach(r => { r.status = status; });
  renderTable();

  try {
    await sbFetch('PATCH',
      `${TABLE}?collection=eq.${encodeURIComponent(activeTabId)}&title=eq.${encodeURIComponent(title)}`,
      { status }
    );
    showSaved();
  } catch(e) {
    rows.forEach((r, i) => { r.status = previousStatuses[i]; });
    renderTable();
    showError(e.message);
  }
}


// ─── Actions ──────────────────────────────────────────────────────────────────
async function toggleWatch(id) {
  const td = tabData[activeTabId];
  const row = td.rows.find(r => r.id === id);
  if (!row) return;
  const newVal = !row.watched;
  row.watched = newVal;
  renderTable();
  try {
    await sbFetch('PATCH', `${TABLE}?id=eq.${id}`, { watched: newVal });
    showSaved();
  } catch(e) {
    row.watched = !newVal;
    renderTable();
    showError(e.message);
  }
}

async function setStatus(id, status, selectEl) {
  const td = tabData[activeTabId];
  const row = td.rows.find(r => r.id === id);
  if (!row) return;
  const old = row.status;
  row.status = status;
  // update select styling immediately
  if (selectEl) {
    selectEl.className = `status-select s-${status}`;
  }
  // update row/card opacity immediately (works for both desktop <tr> and mobile .item-card)
  const container = selectEl?.closest('tr, .item-card');
  if (container) {
    const dimClass = status==='skipped'?'row-skipped':status==='maybe'?'row-maybe':'';
    if (container.tagName === 'TR') {
      container.className = dimClass;
    } else {
      container.className = `item-card ${dimClass}`;
    }
  }
  try {
    await sbFetch('PATCH', `${TABLE}?id=eq.${id}`, { status });
    showSaved();
    // full re-render to update watch button availability and stats
    renderTable();
  } catch(e) {
    row.status = old;
    renderTable();
    showError(e.message);
  }
}

async function delRow(id) {
  if (!confirm('Remove this entry?')) return;
  const td = tabData[activeTabId];
  const idx = td.rows.findIndex(r => r.id === id);
  if (idx === -1) return;
  const row = td.rows[idx];

  // If this row came from the tab's built-in default list, a hard delete would
  // just get silently re-created the next time the tab loads (loadTab reseeds
  // any default key missing from the database). So for defaults, "delete" instead
  // sets status to 'skipped' — same reversible mechanism already used everywhere
  // else in the app (hidden from the default view, visible under "Skipped", and
  // restorable via the existing "↩ Keep" control). Non-default items (anything
  // added manually or pulled from TMDB) have nothing to reseed from, so they keep
  // the exact hard-delete behavior as before.
  const col = COLLECTIONS.find(c => c.id === activeTabId);
  const isDefaultItem = col && Array.isArray(col.defaults) && col.defaults.some(d => d.k === row.item_key);

  if (isDefaultItem) {
    const previousStatus = row.status;
    row.status = 'skipped';
    renderTable();
    try {
      await sbFetch('PATCH', `${TABLE}?id=eq.${id}`, { status: 'skipped' });
      showSaved();
    } catch(e) {
      row.status = previousStatus;
      renderTable();
      showError(e.message);
    }
    return;
  }

  const [removed] = td.rows.splice(idx, 1);
  renderTable();
  try {
    await sbFetch('DELETE', `${TABLE}?id=eq.${id}`, null);
    showSaved();
  } catch(e) {
    td.rows.splice(idx, 0, removed);
    renderTable();
    showError(e.message);
  }
}

function toggleAdd() {
  addOpen = !addOpen;
  document.getElementById('addForm').style.display = addOpen ? 'block' : 'none';
  document.getElementById('addToggleBtn').textContent = addOpen ? '✕ Cancel' : '+ Add entry';
}

function toggleFilters() {
  const el = document.getElementById('filtersRow');
  el.classList.toggle('collapsed');
  const chevron = document.getElementById('filterToggleChevron');
  if (chevron) chevron.textContent = el.classList.contains('collapsed') ? '▾' : '▴';
}

async function addEntry() {
  const title  = document.getElementById('nTitle').value.trim();
  const season = document.getElementById('nSeason').value.trim() || 'Season 1';
  const theme  = document.getElementById('nTheme').value;
  const date   = document.getElementById('nDate').value.trim();
  if (!title || !date) { alert('Please fill in title and premiere date.'); return; }
  const key = title.toLowerCase().trim() + '|' + season.toLowerCase().trim();
  const ds  = parseDate(date);
  const newRow = {
    collection: activeTabId,
    item_key: key,
    title, season, theme,
    display_date: date,
    date_sort: ds,
    watched: false,
    status: 'confirmed'
  };
  try {
    const inserted = await sbFetch('POST', TABLE, [newRow]);
    if (inserted && inserted[0]) {
      tabData[activeTabId].rows.push(inserted[0]);
      tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    }
    showSaved();
    document.getElementById('nTitle').value = '';
    document.getElementById('nDate').value = '';
    document.getElementById('nSeason').value = 'Season 1';
    toggleAdd();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError('This title and season is already on your list.');
    } else {
      showError(e.message);
    }
  }
}

// ─── TMDB: Search ─────────────────────────────────────────────────────────────
async function searchTMDB() {
  const query = document.getElementById('tmdbQuery').value.trim();
  const resultsEl = document.getElementById('tmdbResults');
  cancelTMDBPreview();
  if (!query) { resultsEl.innerHTML = ''; return; }

  resultsEl.innerHTML = `<div class="tmdb-loading">Searching…</div>`;
  try {
    const [tvData, movieData] = await Promise.all([
      tmdbFetch(`/search/tv?query=${encodeURIComponent(query)}&page=1`),
      tmdbFetch(`/search/movie?query=${encodeURIComponent(query)}&page=1`)
    ]);
    const tvResults = (tvData.results || []).map(r => ({ ...r, mediaType: 'tv' }));
    const movieResults = (movieData.results || []).map(r => ({ ...r, mediaType: 'movie' }));
    // interleave-ish: keep TV first (most searches on these two tabs are series), then movies, cap combined at 6
    const results = [...tvResults.slice(0,4), ...movieResults.slice(0,4)].slice(0, 6);

    if (results.length === 0) {
      resultsEl.innerHTML = `<div class="tmdb-no-results">No results found for "${esc(query)}".</div>`;
      return;
    }
    resultsEl.innerHTML = `<div class="tmdb-result-list">${results.map((r, idx) => {
      const isMovie = r.mediaType === 'movie';
      const title = isMovie ? r.title : r.name;
      const dateStr = isMovie ? r.release_date : r.first_air_date;
      const year = dateStr ? dateStr.substring(0,4) : '—';
      const poster = r.poster_path ? `https://image.tmdb.org/t/p/w92${r.poster_path}` : '';
      const typeTag = isMovie ? '<span class="tmdb-type-tag tmdb-type-movie">Film</span>' : '<span class="tmdb-type-tag tmdb-type-tv">Series</span>';
      const titleEsc = esc(title).replace(/'/g,"\\'");
      const resultId = `tmdbResult_${idx}_${r.id}`;
      return `<div class="tmdb-result-item" id="${resultId}" onclick="selectTMDBShow(${r.id}, '${titleEsc}', '${r.mediaType}', '${resultId}')">
        ${poster ? `<img class="tmdb-result-poster" src="${poster}" alt="">` : '<div class="tmdb-result-poster"></div>'}
        <div class="tmdb-result-info">
          <div class="tmdb-result-title">${esc(title)} ${typeTag}</div>
          <div class="tmdb-result-meta">${year}${r.origin_country?.length ? ' · ' + esc(r.origin_country.join(', ')) : ''}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
  } catch(e) {
    resultsEl.innerHTML = `<div class="tmdb-no-results">Search failed: ${esc(e.message)}</div>`;
  }
}

async function selectTMDBShow(tmdbId, name, mediaType, resultId) {
  tmdbSelectedShow = { id: tmdbId, name, mediaType: mediaType || 'tv' };
  tmdbShowSpecials = false;

  // remove any previously-inserted inline preview (only one can be open at a time)
  const oldPreview = document.getElementById('tmdbInlinePreview');
  if (oldPreview) oldPreview.remove();

  // insert a fresh preview container directly after the clicked result row
  const resultRow = document.getElementById(resultId);
  const previewContainer = document.createElement('div');
  previewContainer.id = 'tmdbInlinePreview';
  if (resultRow) {
    resultRow.insertAdjacentElement('afterend', previewContainer);
    resultRow.classList.add('tmdb-result-item-selected');
  } else {
    // fallback: no matching row found (e.g. called from elsewhere) — use the old fixed panel
    const fallback = document.getElementById('tmdbPreview');
    if (fallback) fallback.appendChild(previewContainer);
  }

  previewContainer.innerHTML = `<div class="tmdb-loading">Loading details…</div>`;
  try {
    const details = await tmdbFetch(`/${tmdbSelectedShow.mediaType}/${tmdbId}`);
    tmdbSelectedShow.details = details;
    renderTMDBPreview();
  } catch(e) {
    previewContainer.innerHTML = `<div class="tmdb-no-results">Failed to load details: ${esc(e.message)}</div>`;
  }
}

function getTMDBPreviewContainer() {
  return document.getElementById('tmdbInlinePreview') || document.getElementById('tmdbPreview');
}

function renderTMDBPreview() {
  const previewEl = getTMDBPreviewContainer();
  if (!previewEl || !tmdbSelectedShow || !tmdbSelectedShow.details) return;
  const details = tmdbSelectedShow.details;
  const existingRows = tabData[activeTabId]?.rows || [];
  const showKeyBase = tmdbSelectedShow.name.toLowerCase().trim();

  if (tmdbSelectedShow.mediaType === 'movie') {
    const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${showKeyBase}|film`;
    const alreadyAdded = isAlreadyAdded(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: tmdbSelectedShow.id });
    const date = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const runtime = details.runtime ? `${details.runtime} min` : '';
    const belongsTo = details.belongs_to_collection;
    previewEl.innerHTML = `
      <div class="tmdb-preview">
        <div class="tmdb-preview-header">
          <div>
            <div class="tmdb-preview-title">${esc(tmdbSelectedShow.name)}</div>
            <div class="tmdb-result-meta">${esc(network)}</div>
          </div>
        </div>
        ${belongsTo ? `<div class="tmdb-collection-note">🔗 Part of <strong>${esc(cleanCollectionName(belongsTo.name))}</strong> — you can pull the rest of this collection after adding.</div>` : ''}
        <div class="tmdb-season-row ${alreadyAdded?'already-added':''}">
          <input type="checkbox" ${alreadyAdded?'disabled':'checked'} data-season="film" id="szn_film">
          <span class="tmdb-season-name">Film</span>
          <span class="tmdb-season-meta">${esc(runtime)}${runtime?' · ':''}${esc(date)}</span>
          ${alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
        </div>
        <div class="tmdb-preview-actions">
          <button class="btn btn-accent" onclick="addSelectedTMDBSeasons()">Add film</button>
          <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
        </div>
      </div>
    `;
    return;
  }

  const network = (details.networks && details.networks[0]?.name) || 'Unknown';

  let seasons = (details.seasons || []).filter(s => tmdbShowSpecials || s.season_number !== 0);
  seasons.sort((a,b) => a.season_number - b.season_number);

  const rowsHtml = seasons.map(s => {
    const seasonLabel = s.season_number === 0 ? 'Specials' : `Season ${s.season_number}`;
    const key = `${showKeyBase}|${seasonLabel.toLowerCase()}`;
    const alreadyAdded = isAlreadyAdded(existingRows, { itemKey: key, mediaType: 'tv', tmdbId: tmdbSelectedShow.id, seasonNumber: s.season_number });
    const date = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
    return `<div class="tmdb-season-row ${alreadyAdded?'already-added':''}">
      <input type="checkbox" ${alreadyAdded?'disabled':'checked'} data-season="${s.season_number}" id="szn_${s.season_number}">
      <span class="tmdb-season-name">${esc(seasonLabel)}</span>
      <span class="tmdb-season-meta">${s.episode_count||0} episodes · ${esc(date)}</span>
      ${alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
    </div>`;
  }).join('');

  previewEl.innerHTML = `
    <div class="tmdb-preview">
      <div class="tmdb-preview-header">
        <div>
          <div class="tmdb-preview-title">${esc(tmdbSelectedShow.name)}</div>
          <div class="tmdb-result-meta">${esc(network)}</div>
        </div>
        <label class="tmdb-specials-toggle">
          <input type="checkbox" id="tmdbSpecialsToggle" ${tmdbShowSpecials?'checked':''} onchange="toggleTMDBSpecials()">
          Include specials
        </label>
      </div>
      ${rowsHtml || '<div class="tmdb-no-results">No seasons found.</div>'}
      <div class="tmdb-preview-actions">
        <button class="btn btn-accent" onclick="addSelectedTMDBSeasons()">Add selected seasons</button>
        <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
      </div>
    </div>
  `;
}

function toggleTMDBSpecials() {
  tmdbShowSpecials = document.getElementById('tmdbSpecialsToggle').checked;
  renderTMDBPreview();
}

function cancelTMDBPreview() {
  tmdbSelectedShow = null;
  const inlinePreview = document.getElementById('tmdbInlinePreview');
  if (inlinePreview) inlinePreview.remove();
  document.querySelectorAll('.tmdb-result-item-selected').forEach(el => el.classList.remove('tmdb-result-item-selected'));
  // fallback panel (used only if no result row match was found) — clear it too, harmless if empty
  const fallback = document.getElementById('tmdbPreview');
  if (fallback) fallback.innerHTML = '';
}

// Full reset after a successful add: unlike cancelTMDBPreview (which intentionally
// keeps the results list visible so the user can pick a different match), this
// clears everything — preview, results list, and the search box — since the task
// that produced those results is now done.
function resetTMDBSearchUI() {
  cancelTMDBPreview();
  const resultsEl = document.getElementById('tmdbResults');
  if (resultsEl) resultsEl.innerHTML = '';
  const queryEl = document.getElementById('tmdbQuery');
  if (queryEl) queryEl.value = '';
}


async function addSelectedTMDBSeasons() {
  if (!tmdbSelectedShow || !tmdbSelectedShow.details) return;
  const details = tmdbSelectedShow.details;
  const showName = tmdbSelectedShow.name;
  const showKeyBase = showName.toLowerCase().trim();
  const isMovie = tmdbSelectedShow.mediaType === 'movie';

  let toInsert = [];
  let network;

  if (isMovie) {
    const previewContainer = getTMDBPreviewContainer();
    const cb = previewContainer?.querySelector('input[type="checkbox"][data-season="film"]');
    if (!cb || !cb.checked || cb.disabled) { cancelTMDBPreview(); return; }
    // for the Movies tab, use genre as theme; for True Crime/Docs (movies mixed in there) fall back to production company
    const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
    if (isMoviesTab) {
      network = (details.genres && details.genres[0]?.name) || 'Film';
    } else {
      network = (details.production_companies && details.production_companies[0]?.name) || 'Film';
    }
    const key = `${showKeyBase}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    const belongsTo = details.belongs_to_collection;
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: showName,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: belongsTo ? belongsTo.id : null,
      tmdb_collection_name: belongsTo ? cleanCollectionName(belongsTo.name) : null,
      collections: belongsTo ? [cleanCollectionName(belongsTo.name)] : [],
      media_type: 'movie',
      tmdb_id: tmdbSelectedShow.id,
      season_number: null
    });
  } else {
    network = (details.networks && details.networks[0]?.name) || 'Unknown';
    const previewContainer = getTMDBPreviewContainer();
    const checkboxes = previewContainer ? previewContainer.querySelectorAll('input[type="checkbox"][data-season]') : [];
    const seasonsByNum = {};
    (details.seasons || []).forEach(s => seasonsByNum[s.season_number] = s);

    checkboxes.forEach(cb => {
      if (!cb.checked || cb.disabled) return;
      const num = parseInt(cb.dataset.season, 10);
      const s = seasonsByNum[num];
      if (!s) return;
      const seasonLabel = num === 0 ? 'Specials' : `Season ${num}`;
      const key = `${showKeyBase}|${seasonLabel.toLowerCase()}`;
      const displayDate = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
      const dateSort = s.air_date || '2099-01-01';
      toInsert.push({
        collection: activeTabId,
        item_key: key,
        title: showName,
        season: seasonLabel,
        theme: network,
        display_date: displayDate,
        date_sort: dateSort,
        watched: false,
        status: 'confirmed',
        media_type: 'tv',
        tmdb_id: tmdbSelectedShow.id,
        season_number: num
      });
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));

    // track this show for future refresh lookups (TV shows only — a film has no future seasons)
    // scoped by collection so refresh on one tab doesn't pull in shows from another
    if (!isMovie) {
      try {
        await sbFetch('POST', 'othertv_shows', [{
          tmdb_id: tmdbSelectedShow.id, title: showName, network, collection: activeTabId
        }]);
      } catch(e) {
        // Expected: this show is already tracked for this collection (unique constraint
        // on collection+tmdb_id) — that's fine, nothing to do. Anything else is a real
        // failure (e.g. network/Supabase issue) and should be surfaced, not hidden,
        // since it means "Refresh shows" won't find this show later.
        if (!(e.message.includes('23505') || e.message.includes('duplicate key'))) {
          showError(`Added, but couldn't register this show for future refresh checks: ${e.message}`);
        }
      }
    }

    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try searching again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

async function openPullCollection(rowId, collectionId, collectionName) {

async function addPulledCollectionMovies() {
  const data = window.__pullCollectionData;
  if (!data) return;
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-movie-id]');
  const moviesById = {};
  data.movies.forEach(m => moviesById[m.id] = m);
  const seenTmdbIds = new Set();

  const toInsert = [];
  for (const cb of checkboxes) {
    if (!cb.checked || cb.disabled) continue;
    const movieId = parseInt(cb.dataset.movieId, 10);
    const summary = moviesById[movieId];
    if (!summary) continue;
    // Dedupe by tmdbId, not by title/item_key — same defensive pattern as
    // addPulledPersonMovies. This is an additional layer in front of the
    // database's own uniqueness enforcement, not a replacement for it —
    // it only prevents the same movie appearing twice within THIS pending
    // batch before the insert call is made.
    if (seenTmdbIds.has(movieId)) continue;
    seenTmdbIds.add(movieId);
    // fetch full details for genre/runtime accuracy, same as a normal add
    let details;
    try { details = await tmdbFetch(`/movie/${movieId}`); } catch(e) { continue; }
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${summary.title.toLowerCase().trim()}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: summary.title,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: data.collectionId,
      tmdb_collection_name: data.collectionName,
      collections: [data.collectionName],
      media_type: 'movie',
      tmdb_id: movieId,
      season_number: null
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try "🔗 Pull rest of collection" again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────
async function refreshShows() {
  cancelTMDBPreview();
  const previewEl = document.getElementById('tmdbPreview');
  const resultsEl = document.getElementById('tmdbResults');
  resultsEl.innerHTML = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Checking for new seasons…</div>`;

  try {
    const trackedShows = await sbFetch('GET', `othertv_shows?collection=eq.${encodeURIComponent(activeTabId)}&select=*`, null);
    if (!trackedShows || trackedShows.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-no-results">No shows added via search yet — nothing to refresh.</div>`;
      return;
    }

    const existingRows = tabData[activeTabId]?.rows || [];
    const newSeasonsByShow = [];

    for (const show of trackedShows) {
      let details;
      try {
        details = await tmdbFetch(`/tv/${show.tmdb_id}`);
      } catch(e) { continue; }
      const showKeyBase = show.title.toLowerCase().trim();
      const seasons = (details.seasons || []).filter(s => tmdbShowSpecials || s.season_number !== 0);
      const newOnes = seasons.filter(s => {
        const label = s.season_number === 0 ? 'specials' : `season ${s.season_number}`;
        return !isAlreadyAdded(existingRows, { itemKey: `${showKeyBase}|${label}`, mediaType: 'tv', tmdbId: show.tmdb_id, seasonNumber: s.season_number });
      });
      if (newOnes.length > 0) {
        newSeasonsByShow.push({ show, details, newOnes });
      }
    }

    if (newSeasonsByShow.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-refresh-summary">✓ Everything's up to date — no new seasons found across ${trackedShows.length} tracked show${trackedShows.length===1?'':'s'}.</div>`;
      return;
    }

    let html = `<div class="tmdb-preview"><div class="tmdb-preview-title">New seasons found</div>`;
    newSeasonsByShow.forEach(({show, newOnes}, idx) => {
      html += `<div style="margin-top:10px"><div class="tmdb-result-title">${esc(show.title)}</div>`;
      newOnes.forEach(s => {
        const label = s.season_number === 0 ? 'Specials' : `Season ${s.season_number}`;
        const date = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
        html += `<div class="tmdb-season-row">
          <input type="checkbox" checked data-show-idx="${idx}" data-season="${s.season_number}">
          <span class="tmdb-season-name">${esc(label)}</span>
          <span class="tmdb-season-meta">${s.episode_count||0} episodes · ${esc(date)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `<div class="tmdb-preview-actions">
      <button class="btn btn-accent" onclick="addRefreshedSeasons()">Add selected seasons</button>
      <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
    </div></div>`;
    previewEl.innerHTML = html;
    window.__refreshData = newSeasonsByShow;
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Refresh failed: ${esc(e.message)}</div>`;
  }
}

// ─── Movies: Refresh tracked collections/franchises ───────────────────────────
async function refreshCollections() {
  cancelTMDBPreview();
  const previewEl = document.getElementById('tmdbPreview');
  const resultsEl = document.getElementById('tmdbResults');
  resultsEl.innerHTML = '';
  document.getElementById('tmdbQuery').value = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Checking your tracked collections…</div>`;

  const td = tabData[activeTabId];
  const rows = td?.rows || [];

  // distinct collections already represented in this tab's movies
  const collectionsMap = new Map(); // id -> name
  rows.forEach(r => {
    if (r.tmdb_collection_id) collectionsMap.set(r.tmdb_collection_id, r.tmdb_collection_name || 'Collection');
  });

  if (collectionsMap.size === 0) {
    previewEl.innerHTML = `<div class="tmdb-no-results">No tracked collections yet — add a movie that belongs to a franchise (e.g. a Marvel or Bourne film) to start tracking one.</div>`;
    return;
  }

  try {
    const newByCollection = [];
    for (const [collectionId, collectionName] of collectionsMap.entries()) {
      let data;
      try { data = await tmdbFetch(`/collection/${collectionId}`); } catch(e) { continue; }
      const movies = data.parts || [];
      const newOnes = movies.filter(m => !isAlreadyAdded(rows, { itemKey: `${m.title.toLowerCase().trim()}|film`, mediaType: 'movie', tmdbId: m.id }));
      if (newOnes.length > 0) {
        newByCollection.push({ collectionId, collectionName, newOnes });
      }
    }

    if (newByCollection.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-refresh-summary">✓ Everything's up to date — no new movies found across ${collectionsMap.size} tracked collection${collectionsMap.size===1?'':'s'}.</div>`;
      return;
    }

    let html = `<div class="tmdb-preview"><div class="tmdb-preview-title">New movies found</div>`;
    newByCollection.forEach(({collectionName, newOnes}, idx) => {
      html += `<div style="margin-top:10px"><div class="tmdb-result-title">${esc(collectionName)}</div>`;
      newOnes.forEach(m => {
        const date = m.release_date ? formatDisplayDate(m.release_date) : 'TBA';
        html += `<div class="tmdb-season-row">
          <input type="checkbox" checked data-collection-idx="${idx}" data-movie-id="${m.id}">
          <span class="tmdb-season-name">${esc(m.title)}</span>
          <span class="tmdb-season-meta">${esc(date)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `<div class="tmdb-preview-actions">
      <button class="btn btn-accent" onclick="addRefreshedCollectionMovies()">Add selected</button>
      <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
    </div></div>`;
    previewEl.innerHTML = html;
    window.__refreshCollectionsData = newByCollection;
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Refresh failed: ${esc(e.message)}</div>`;
  }
}

// ─── Curated universe pull (MCU, and any future hand-maintained universes) ────

async function pullUniverse(universeKey) {
  const universe = UNIVERSE_LISTS[universeKey];
  if (!universe) return;
  cancelTMDBPreview();
  const resultsEl = document.getElementById('tmdbResults');
  const previewEl = document.getElementById('tmdbPreview');
  resultsEl.innerHTML = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Looking up ${esc(universe.label)} titles…</div>`;

  const td = tabData[activeTabId];
  const existingRows = td?.rows || [];
  const found = [];
  const notFound = [];
  let backfilled = 0;

  for (const title of universe.titles) {
    // Step 1: always resolve the real TMDB match first — never skip this based
    // on a title-only guess, so we always know the real tmdb_id before deciding
    // whether this is already on the list.
    let match;
    try {
      const data = await tmdbFetch(`/search/movie?query=${encodeURIComponent(title)}`);
      match = (data.results || []).find(m => m.title.toLowerCase() === title.toLowerCase()) || (data.results || [])[0];
    } catch(e) {
      match = null;
    }
    if (!match) {
      notFound.push(title);
      continue;
    }

    // Step 2: now check existing rows using TMDB-first identity, falling back
    // to item_key only for rows that haven't been backfilled with a tmdb_id yet.
    // Uses the same shared helper as every other TMDB-driven flow, so this
    // logic can't drift out of sync with the canonical identity rules.
    const key = `${title.toLowerCase().trim()}|film`;
    const existingRow = findExistingRow(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: match.id });

    if (existingRow) {
      found.push({ title, alreadyAdded: true });
      // backfill the universe tag if this row predates the universe-pull feature
      const currentCollections = existingRow.collections || [];
      if (!currentCollections.includes(universe.label)) {
        const updated = [...currentCollections, universe.label];
        try {
          await sbFetch('PATCH', `${TABLE}?id=eq.${existingRow.id}`, { collections: updated });
          existingRow.collections = updated;
          backfilled++;
        } catch(e) { /* non-fatal — leave it as-is if the patch fails */ }
      }
    } else {
      found.push({ title, tmdbId: match.id, releaseDate: match.release_date, alreadyAdded: false });
    }
  }

  found.sort((a,b) => (a.releaseDate||'9999').localeCompare(b.releaseDate||'9999'));

  const rowsHtml = found.map(m => {
    const date = m.releaseDate ? formatDisplayDate(m.releaseDate) : 'TBA';
    return `<div class="tmdb-season-row ${m.alreadyAdded?'already-added':''}">
      <input type="checkbox" ${m.alreadyAdded?'disabled':'checked'} data-tmdb-id="${m.tmdbId||''}" data-title="${esc(m.title).replace(/'/g,"\\'")}" id="uni_${m.tmdbId||m.title.replace(/\W/g,'')}">
      <span class="tmdb-season-name">${esc(m.title)}</span>
      <span class="tmdb-season-meta">${esc(date)}</span>
      ${m.alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
    </div>`;
  }).join('');

  const notFoundHtml = notFound.length
    ? `<div class="tmdb-refresh-summary">Couldn't find on TMDB: ${notFound.map(esc).join(', ')}</div>`
    : '';
  const backfillHtml = backfilled > 0
    ? `<div class="tmdb-refresh-summary">✓ Tagged ${backfilled} already-added movie${backfilled===1?'':'s'} with "${esc(universe.label)}" that were missing it.</div>`
    : '';

  window.__universePullKey = universeKey;

  previewEl.innerHTML = `
    <div class="tmdb-preview">
      <div class="tmdb-preview-header">
        <div class="tmdb-preview-title">${esc(universe.label)}</div>
        <div class="tmdb-result-meta">${found.filter(f=>!f.alreadyAdded).length} new, ${found.filter(f=>f.alreadyAdded).length} already on your list</div>
      </div>
      ${backfillHtml}
      ${rowsHtml || '<div class="tmdb-no-results">Nothing found.</div>'}
      ${notFoundHtml}
      <div class="tmdb-preview-actions">
        <button class="btn btn-accent" onclick="addPulledUniverseMovies()">Add selected</button>
        <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
      </div>
    </div>
  `;
  if (backfilled > 0) { showSaved(); renderTable(); }
}

async function addPulledUniverseMovies() {
  const universeKey = window.__universePullKey;
  const universe = UNIVERSE_LISTS[universeKey];
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-tmdb-id]');
  const toInsert = [];

  for (const cb of checkboxes) {
    if (!cb.checked || cb.disabled) continue;
    const tmdbId = cb.dataset.tmdbId;
    const title = cb.dataset.title;
    if (!tmdbId) continue;
    let details;
    try { details = await tmdbFetch(`/movie/${tmdbId}`); } catch(e) { continue; }
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${title.toLowerCase().trim()}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    const belongsTo = details.belongs_to_collection;
    const collections = belongsTo ? [cleanCollectionName(belongsTo.name), universe?.label || universeKey] : [universe?.label || universeKey];
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: belongsTo ? belongsTo.id : null,
      tmdb_collection_name: belongsTo ? cleanCollectionName(belongsTo.name) : null,
      collections,
      media_type: 'movie',
      tmdb_id: parseInt(tmdbId, 10),
      season_number: null
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try the universe pull again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

async function searchPersonForCollection() {
  const name = document.getElementById('personNameInput').value.trim();
  const resultsEl = document.getElementById('personMatchResults');
  if (!name) return;
  resultsEl.innerHTML = `<div class="tmdb-loading">Searching…</div>`;
  try {
    const data = await tmdbFetch(`/search/person?query=${encodeURIComponent(name)}`);
    const matches = (data.results || []).slice(0, 5);
    if (matches.length === 0) {
      resultsEl.innerHTML = `<div class="tmdb-no-results">No one found matching "${esc(name)}".</div>`;
      return;
    }
    resultsEl.innerHTML = matches.map(p => {
      const photo = p.profile_path ? `https://image.tmdb.org/t/p/w92${p.profile_path}` : '';
      const known = (p.known_for || []).map(k => k.title || k.name).filter(Boolean).slice(0,3).join(', ');
      const nameEsc = esc(p.name).replace(/'/g,"\\'");
      return `<div class="person-match-item" onclick="selectPersonForCollection(${p.id}, '${nameEsc}')">
        ${photo ? `<img class="person-match-photo" src="${photo}" alt="">` : '<div class="person-match-photo"></div>'}
        <div class="person-match-info">
          <div class="person-match-name">${esc(p.name)}</div>
          ${known ? `<div class="person-match-known">Known for: ${esc(known)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    resultsEl.innerHTML = `<div class="tmdb-no-results">Search failed: ${esc(e.message)}</div>`;
  }
}

  await pullPersonFilmography(pending.personId, pending.personName, /*isNewCollection*/ true, role, pending.credits);
