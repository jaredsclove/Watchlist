async function addEntry() {
  const title  = document.getElementById('nTitle').value.trim();
  const season = document.getElementById('nSeason').value.trim() || 'Season 1';
  const theme  = document.getElementById('nTheme').value;
  const date   = document.getElementById('nDate').value.trim();
  if (!title || !date) { alert('Please fill in title and premiere date.'); return; }
  const key = title.toLowerCase().trim() + '|' + season.toLowerCase().trim();
  const ds  = parseDate(date);
  const newRow = {
    collection: activeTabId,
    item_key: key,
    title, season, theme,
    display_date: date,
    date_sort: ds,
    watched: false,
    status: 'confirmed'
  };
  try {
    const inserted = await sbFetch('POST', TABLE, [newRow]);
    if (inserted && inserted[0]) {
      tabData[activeTabId].rows.push(inserted[0]);
      tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    }
    showSaved();
    document.getElementById('nTitle').value = '';
    document.getElementById('nDate').value = '';
    document.getElementById('nSeason').value = 'Season 1';
    toggleAdd();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError('This title and season is already on your list.');
    } else {
      showError(e.message);
    }
  }
}

// ─── TMDB: Search ─────────────────────────────────────────────────────────────
async function searchTMDB() {
  const query = document.getElementById('tmdbQuery').value.trim();
  const resultsEl = document.getElementById('tmdbResults');
  cancelTMDBPreview();
  if (!query) { resultsEl.innerHTML = ''; return; }

  resultsEl.innerHTML = `<div class="tmdb-loading">Searching…</div>`;
  try {
    const [tvData, movieData] = await Promise.all([
      tmdbFetch(`/search/tv?query=${encodeURIComponent(query)}&page=1`),
      tmdbFetch(`/search/movie?query=${encodeURIComponent(query)}&page=1`)
    ]);
    const tvResults = (tvData.results || []).map(r => ({ ...r, mediaType: 'tv' }));
    const movieResults = (movieData.results || []).map(r => ({ ...r, mediaType: 'movie' }));
    // interleave-ish: keep TV first (most searches on these two tabs are series), then movies, cap combined at 6
    const results = [...tvResults.slice(0,4), ...movieResults.slice(0,4)].slice(0, 6);

    if (results.length === 0) {
      resultsEl.innerHTML = `<div class="tmdb-no-results">No results found for "${esc(query)}".</div>`;
      return;
    }
    resultsEl.innerHTML = `<div class="tmdb-result-list">${results.map((r, idx) => {
      const isMovie = r.mediaType === 'movie';
      const title = isMovie ? r.title : r.name;
      const dateStr = isMovie ? r.release_date : r.first_air_date;
      const year = dateStr ? dateStr.substring(0,4) : '—';
      const poster = r.poster_path ? `https://image.tmdb.org/t/p/w92${r.poster_path}` : '';
      const typeTag = isMovie ? '<span class="tmdb-type-tag tmdb-type-movie">Film</span>' : '<span class="tmdb-type-tag tmdb-type-tv">Series</span>';
      const titleEsc = esc(title).replace(/'/g,"\\'");
      const resultId = `tmdbResult_${idx}_${r.id}`;
      return `<div class="tmdb-result-item" id="${resultId}" onclick="selectTMDBShow(${r.id}, '${titleEsc}', '${r.mediaType}', '${resultId}')">
        ${poster ? `<img class="tmdb-result-poster" src="${poster}" alt="">` : '<div class="tmdb-result-poster"></div>'}
        <div class="tmdb-result-info">
          <div class="tmdb-result-title">${esc(title)} ${typeTag}</div>
          <div class="tmdb-result-meta">${year}${r.origin_country?.length ? ' · ' + esc(r.origin_country.join(', ')) : ''}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
  } catch(e) {
    resultsEl.innerHTML = `<div class="tmdb-no-results">Search failed: ${esc(e.message)}</div>`;
  }
}

async function selectTMDBShow(tmdbId, name, mediaType, resultId) {
  tmdbSelectedShow = { id: tmdbId, name, mediaType: mediaType || 'tv' };
  tmdbShowSpecials = false;

  // remove any previously-inserted inline preview (only one can be open at a time)
  const oldPreview = document.getElementById('tmdbInlinePreview');
  if (oldPreview) oldPreview.remove();

  // insert a fresh preview container directly after the clicked result row
  const resultRow = document.getElementById(resultId);
  const previewContainer = document.createElement('div');
  previewContainer.id = 'tmdbInlinePreview';
  if (resultRow) {
    resultRow.insertAdjacentElement('afterend', previewContainer);
    resultRow.classList.add('tmdb-result-item-selected');
  } else {
    // fallback: no matching row found (e.g. called from elsewhere) — use the old fixed panel
    const fallback = document.getElementById('tmdbPreview');
    if (fallback) fallback.appendChild(previewContainer);
  }

  previewContainer.innerHTML = `<div class="tmdb-loading">Loading details…</div>`;
  try {
    const details = await tmdbFetch(`/${tmdbSelectedShow.mediaType}/${tmdbId}`);
    tmdbSelectedShow.details = details;
    renderTMDBPreview();
  } catch(e) {
    previewContainer.innerHTML = `<div class="tmdb-no-results">Failed to load details: ${esc(e.message)}</div>`;
  }
}

function getTMDBPreviewContainer() {
  return document.getElementById('tmdbInlinePreview') || document.getElementById('tmdbPreview');
}

function renderTMDBPreview() {
  const previewEl = getTMDBPreviewContainer();
  if (!previewEl || !tmdbSelectedShow || !tmdbSelectedShow.details) return;
  const details = tmdbSelectedShow.details;
  const existingRows = tabData[activeTabId]?.rows || [];
  const showKeyBase = tmdbSelectedShow.name.toLowerCase().trim();

  if (tmdbSelectedShow.mediaType === 'movie') {
    const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${showKeyBase}|film`;
    const alreadyAdded = isAlreadyAdded(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: tmdbSelectedShow.id });
    const date = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const runtime = details.runtime ? `${details.runtime} min` : '';
    const belongsTo = details.belongs_to_collection;
    previewEl.innerHTML = `
      <div class="tmdb-preview">
        <div class="tmdb-preview-header">
          <div>
            <div class="tmdb-preview-title">${esc(tmdbSelectedShow.name)}</div>
            <div class="tmdb-result-meta">${esc(network)}</div>
          </div>
        </div>
        ${belongsTo ? `<div class="tmdb-collection-note">🔗 Part of <strong>${esc(cleanCollectionName(belongsTo.name))}</strong> — you can pull the rest of this collection after adding.</div>` : ''}
        <div class="tmdb-season-row ${alreadyAdded?'already-added':''}">
          <input type="checkbox" ${alreadyAdded?'disabled':'checked'} data-season="film" id="szn_film">
          <span class="tmdb-season-name">Film</span>
          <span class="tmdb-season-meta">${esc(runtime)}${runtime?' · ':''}${esc(date)}</span>
          ${alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
        </div>
        <div class="tmdb-preview-actions">
          <button class="btn btn-accent" onclick="addSelectedTMDBSeasons()">Add film</button>
          <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
        </div>
      </div>
    `;
    return;
  }

  const network = (details.networks && details.networks[0]?.name) || 'Unknown';

  let seasons = (details.seasons || []).filter(s => tmdbShowSpecials || s.season_number !== 0);
  seasons.sort((a,b) => a.season_number - b.season_number);

  const rowsHtml = seasons.map(s => {
    const seasonLabel = s.season_number === 0 ? 'Specials' : `Season ${s.season_number}`;
    const key = `${showKeyBase}|${seasonLabel.toLowerCase()}`;
    const alreadyAdded = isAlreadyAdded(existingRows, { itemKey: key, mediaType: 'tv', tmdbId: tmdbSelectedShow.id, seasonNumber: s.season_number });
    const date = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
    return `<div class="tmdb-season-row ${alreadyAdded?'already-added':''}">
      <input type="checkbox" ${alreadyAdded?'disabled':'checked'} data-season="${s.season_number}" id="szn_${s.season_number}">
      <span class="tmdb-season-name">${esc(seasonLabel)}</span>
      <span class="tmdb-season-meta">${s.episode_count||0} episodes · ${esc(date)}</span>
      ${alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
    </div>`;
  }).join('');

  previewEl.innerHTML = `
    <div class="tmdb-preview">
      <div class="tmdb-preview-header">
        <div>
          <div class="tmdb-preview-title">${esc(tmdbSelectedShow.name)}</div>
          <div class="tmdb-result-meta">${esc(network)}</div>
        </div>
        <label class="tmdb-specials-toggle">
          <input type="checkbox" id="tmdbSpecialsToggle" ${tmdbShowSpecials?'checked':''} onchange="toggleTMDBSpecials()">
          Include specials
        </label>
      </div>
      ${rowsHtml || '<div class="tmdb-no-results">No seasons found.</div>'}
      <div class="tmdb-preview-actions">
        <button class="btn btn-accent" onclick="addSelectedTMDBSeasons()">Add selected seasons</button>
        <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
      </div>
    </div>
  `;
}

function toggleTMDBSpecials() {
  tmdbShowSpecials = document.getElementById('tmdbSpecialsToggle').checked;
  renderTMDBPreview();
}

function cancelTMDBPreview() {
  tmdbSelectedShow = null;
  const inlinePreview = document.getElementById('tmdbInlinePreview');
  if (inlinePreview) inlinePreview.remove();
  document.querySelectorAll('.tmdb-result-item-selected').forEach(el => el.classList.remove('tmdb-result-item-selected'));
  // fallback panel (used only if no result row match was found) — clear it too, harmless if empty
  const fallback = document.getElementById('tmdbPreview');
  if (fallback) fallback.innerHTML = '';
}

// Full reset after a successful add: unlike cancelTMDBPreview (which intentionally
// keeps the results list visible so the user can pick a different match), this
// clears everything — preview, results list, and the search box — since the task
// that produced those results is now done.
function resetTMDBSearchUI() {
  cancelTMDBPreview();
  const resultsEl = document.getElementById('tmdbResults');
  if (resultsEl) resultsEl.innerHTML = '';
  const queryEl = document.getElementById('tmdbQuery');
  if (queryEl) queryEl.value = '';
}

function formatDisplayDate(isoDate) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [y,m,d] = isoDate.split('-').map(Number);
  if (!y || !m || !d) return isoDate;
  return `${months[m-1]} ${d}, ${y}`;
}

async function addSelectedTMDBSeasons() {
  if (!tmdbSelectedShow || !tmdbSelectedShow.details) return;
  const details = tmdbSelectedShow.details;
  const showName = tmdbSelectedShow.name;
  const showKeyBase = showName.toLowerCase().trim();
  const isMovie = tmdbSelectedShow.mediaType === 'movie';

  let toInsert = [];
  let network;

  if (isMovie) {
    const previewContainer = getTMDBPreviewContainer();
    const cb = previewContainer?.querySelector('input[type="checkbox"][data-season="film"]');
    if (!cb || !cb.checked || cb.disabled) { cancelTMDBPreview(); return; }
    // for the Movies tab, use genre as theme; for True Crime/Docs (movies mixed in there) fall back to production company
    const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
    if (isMoviesTab) {
      network = (details.genres && details.genres[0]?.name) || 'Film';
    } else {
      network = (details.production_companies && details.production_companies[0]?.name) || 'Film';
    }
    const key = `${showKeyBase}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    const belongsTo = details.belongs_to_collection;
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: showName,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: belongsTo ? belongsTo.id : null,
      tmdb_collection_name: belongsTo ? cleanCollectionName(belongsTo.name) : null,
      collections: belongsTo ? [cleanCollectionName(belongsTo.name)] : [],
      media_type: 'movie',
      tmdb_id: tmdbSelectedShow.id,
      season_number: null
    });
  } else {
    network = (details.networks && details.networks[0]?.name) || 'Unknown';
    const previewContainer = getTMDBPreviewContainer();
    const checkboxes = previewContainer ? previewContainer.querySelectorAll('input[type="checkbox"][data-season]') : [];
    const seasonsByNum = {};
    (details.seasons || []).forEach(s => seasonsByNum[s.season_number] = s);

    checkboxes.forEach(cb => {
      if (!cb.checked || cb.disabled) return;
      const num = parseInt(cb.dataset.season, 10);
      const s = seasonsByNum[num];
      if (!s) return;
      const seasonLabel = num === 0 ? 'Specials' : `Season ${num}`;
      const key = `${showKeyBase}|${seasonLabel.toLowerCase()}`;
      const displayDate = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
      const dateSort = s.air_date || '2099-01-01';
      toInsert.push({
        collection: activeTabId,
        item_key: key,
        title: showName,
        season: seasonLabel,
        theme: network,
        display_date: displayDate,
        date_sort: dateSort,
        watched: false,
        status: 'confirmed',
        media_type: 'tv',
        tmdb_id: tmdbSelectedShow.id,
        season_number: num
      });
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));

    // track this show for future refresh lookups (TV shows only — a film has no future seasons)
    // scoped by collection so refresh on one tab doesn't pull in shows from another
    if (!isMovie) {
      try {
        await sbFetch('POST', 'othertv_shows', [{
          tmdb_id: tmdbSelectedShow.id, title: showName, network, collection: activeTabId
        }]);
      } catch(e) {
        // Expected: this show is already tracked for this collection (unique constraint
        // on collection+tmdb_id) — that's fine, nothing to do. Anything else is a real
        // failure (e.g. network/Supabase issue) and should be surfaced, not hidden,
        // since it means "Refresh shows" won't find this show later.
        if (!(e.message.includes('23505') || e.message.includes('duplicate key'))) {
          showError(`Added, but couldn't register this show for future refresh checks: ${e.message}`);
        }
      }
    }

    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try searching again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────
// ─── Pull entire collection (available anytime from any movie row) ───────────
async function openPullCollection(rowId, collectionId, collectionName) {
  // scroll the TMDB panel into view and show loading state
  cancelTMDBPreview();
  const previewEl = document.getElementById('tmdbPreview');
  const resultsEl = document.getElementById('tmdbResults');
  if (!previewEl) return;
  resultsEl.innerHTML = '';
  document.getElementById('tmdbQuery').value = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Loading ${esc(collectionName)}…</div>`;
  previewEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

  try {
    const data = await tmdbFetch(`/collection/${collectionId}`);
    const movies = (data.parts || []).slice().sort((a,b) => (a.release_date||'9999').localeCompare(b.release_date||'9999'));
    const existingRows = tabData[activeTabId]?.rows || [];

    const rowsHtml = movies.map(m => {
      const key = `${m.title.toLowerCase().trim()}|film`;
      const alreadyAdded = isAlreadyAdded(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: m.id });
      const date = m.release_date ? formatDisplayDate(m.release_date) : 'TBA';
      return `<div class="tmdb-season-row ${alreadyAdded?'already-added':''}">
        <input type="checkbox" ${alreadyAdded?'disabled':'checked'} data-movie-id="${m.id}" id="pull_${m.id}">
        <span class="tmdb-season-name">${esc(m.title)}</span>
        <span class="tmdb-season-meta">${esc(date)}</span>
        ${alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
      </div>`;
    }).join('');

    window.__pullCollectionData = { collectionId, collectionName, movies };

    previewEl.innerHTML = `
      <div class="tmdb-preview">
        <div class="tmdb-preview-header">
          <div class="tmdb-preview-title">${esc(collectionName)}</div>
        </div>
        ${rowsHtml || '<div class="tmdb-no-results">No other movies found in this collection.</div>'}
        <div class="tmdb-preview-actions">
          <button class="btn btn-accent" onclick="addPulledCollectionMovies()">Add selected</button>
          <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
        </div>
      </div>
    `;
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Failed to load collection: ${esc(e.message)}</div>`;
  }
}

async function addPulledCollectionMovies() {
  const data = window.__pullCollectionData;
  if (!data) return;
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-movie-id]');
  const moviesById = {};
  data.movies.forEach(m => moviesById[m.id] = m);
  const seenTmdbIds = new Set();

  const toInsert = [];
  for (const cb of checkboxes) {
    if (!cb.checked || cb.disabled) continue;
    const movieId = parseInt(cb.dataset.movieId, 10);
    const summary = moviesById[movieId];
    if (!summary) continue;
    // Dedupe by tmdbId, not by title/item_key — same defensive pattern as
    // addPulledPersonMovies. This is an additional layer in front of the
    // database's own uniqueness enforcement, not a replacement for it —
    // it only prevents the same movie appearing twice within THIS pending
    // batch before the insert call is made.
    if (seenTmdbIds.has(movieId)) continue;
    seenTmdbIds.add(movieId);
    // fetch full details for genre/runtime accuracy, same as a normal add
    let details;
    try { details = await tmdbFetch(`/movie/${movieId}`); } catch(e) { continue; }
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${summary.title.toLowerCase().trim()}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: summary.title,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: data.collectionId,
      tmdb_collection_name: data.collectionName,
      collections: [data.collectionName],
      media_type: 'movie',
      tmdb_id: movieId,
      season_number: null
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try "🔗 Pull rest of collection" again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

// ─── TMDB: Refresh existing shows ─────────────────────────────────────────────
async function refreshShows() {
  cancelTMDBPreview();
  const previewEl = document.getElementById('tmdbPreview');
  const resultsEl = document.getElementById('tmdbResults');
  resultsEl.innerHTML = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Checking for new seasons…</div>`;

  try {
    const trackedShows = await sbFetch('GET', `othertv_shows?collection=eq.${encodeURIComponent(activeTabId)}&select=*`, null);
    if (!trackedShows || trackedShows.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-no-results">No shows added via search yet — nothing to refresh.</div>`;
      return;
    }

    const existingRows = tabData[activeTabId]?.rows || [];
    const newSeasonsByShow = [];

    for (const show of trackedShows) {
      let details;
      try {
        details = await tmdbFetch(`/tv/${show.tmdb_id}`);
      } catch(e) { continue; }
      const showKeyBase = show.title.toLowerCase().trim();
      const seasons = (details.seasons || []).filter(s => tmdbShowSpecials || s.season_number !== 0);
      const newOnes = seasons.filter(s => {
        const label = s.season_number === 0 ? 'specials' : `season ${s.season_number}`;
        return !isAlreadyAdded(existingRows, { itemKey: `${showKeyBase}|${label}`, mediaType: 'tv', tmdbId: show.tmdb_id, seasonNumber: s.season_number });
      });
      if (newOnes.length > 0) {
        newSeasonsByShow.push({ show, details, newOnes });
      }
    }

    if (newSeasonsByShow.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-refresh-summary">✓ Everything's up to date — no new seasons found across ${trackedShows.length} tracked show${trackedShows.length===1?'':'s'}.</div>`;
      return;
    }

    let html = `<div class="tmdb-preview"><div class="tmdb-preview-title">New seasons found</div>`;
    newSeasonsByShow.forEach(({show, newOnes}, idx) => {
      html += `<div style="margin-top:10px"><div class="tmdb-result-title">${esc(show.title)}</div>`;
      newOnes.forEach(s => {
        const label = s.season_number === 0 ? 'Specials' : `Season ${s.season_number}`;
        const date = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
        html += `<div class="tmdb-season-row">
          <input type="checkbox" checked data-show-idx="${idx}" data-season="${s.season_number}">
          <span class="tmdb-season-name">${esc(label)}</span>
          <span class="tmdb-season-meta">${s.episode_count||0} episodes · ${esc(date)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `<div class="tmdb-preview-actions">
      <button class="btn btn-accent" onclick="addRefreshedSeasons()">Add selected seasons</button>
      <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
    </div></div>`;
    previewEl.innerHTML = html;
    window.__refreshData = newSeasonsByShow;
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Refresh failed: ${esc(e.message)}</div>`;
  }
}

// ─── Movies: Refresh tracked collections/franchises ───────────────────────────
async function refreshCollections() {
  cancelTMDBPreview();
  const previewEl = document.getElementById('tmdbPreview');
  const resultsEl = document.getElementById('tmdbResults');
  resultsEl.innerHTML = '';
  document.getElementById('tmdbQuery').value = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Checking your tracked collections…</div>`;

  const td = tabData[activeTabId];
  const rows = td?.rows || [];

  // distinct collections already represented in this tab's movies
  const collectionsMap = new Map(); // id -> name
  rows.forEach(r => {
    if (r.tmdb_collection_id) collectionsMap.set(r.tmdb_collection_id, r.tmdb_collection_name || 'Collection');
  });

  if (collectionsMap.size === 0) {
    previewEl.innerHTML = `<div class="tmdb-no-results">No tracked collections yet — add a movie that belongs to a franchise (e.g. a Marvel or Bourne film) to start tracking one.</div>`;
    return;
  }

  try {
    const newByCollection = [];
    for (const [collectionId, collectionName] of collectionsMap.entries()) {
      let data;
      try { data = await tmdbFetch(`/collection/${collectionId}`); } catch(e) { continue; }
      const movies = data.parts || [];
      const newOnes = movies.filter(m => !isAlreadyAdded(rows, { itemKey: `${m.title.toLowerCase().trim()}|film`, mediaType: 'movie', tmdbId: m.id }));
      if (newOnes.length > 0) {
        newByCollection.push({ collectionId, collectionName, newOnes });
      }
    }

    if (newByCollection.length === 0) {
      previewEl.innerHTML = `<div class="tmdb-refresh-summary">✓ Everything's up to date — no new movies found across ${collectionsMap.size} tracked collection${collectionsMap.size===1?'':'s'}.</div>`;
      return;
    }

    let html = `<div class="tmdb-preview"><div class="tmdb-preview-title">New movies found</div>`;
    newByCollection.forEach(({collectionName, newOnes}, idx) => {
      html += `<div style="margin-top:10px"><div class="tmdb-result-title">${esc(collectionName)}</div>`;
      newOnes.forEach(m => {
        const date = m.release_date ? formatDisplayDate(m.release_date) : 'TBA';
        html += `<div class="tmdb-season-row">
          <input type="checkbox" checked data-collection-idx="${idx}" data-movie-id="${m.id}">
          <span class="tmdb-season-name">${esc(m.title)}</span>
          <span class="tmdb-season-meta">${esc(date)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `<div class="tmdb-preview-actions">
      <button class="btn btn-accent" onclick="addRefreshedCollectionMovies()">Add selected</button>
      <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
    </div></div>`;
    previewEl.innerHTML = html;
    window.__refreshCollectionsData = newByCollection;
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Refresh failed: ${esc(e.message)}</div>`;
  }
}

async function addRefreshedCollectionMovies() {
  const data = window.__refreshCollectionsData || [];
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-collection-idx]');
  const toInsert = [];

  for (const cb of checkboxes) {
    if (!cb.checked) continue;
    const idx = parseInt(cb.dataset.collectionIdx, 10);
    const movieId = parseInt(cb.dataset.movieId, 10);
    const entry = data[idx];
    if (!entry) continue;
    const summary = entry.newOnes.find(m => m.id === movieId);
    if (!summary) continue;
    let details;
    try { details = await tmdbFetch(`/movie/${movieId}`); } catch(e) { continue; }
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const key = `${summary.title.toLowerCase().trim()}|film`;
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: summary.title,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: entry.collectionId,
      tmdb_collection_name: entry.collectionName,
      collections: [entry.collectionName],
      media_type: 'movie',
      tmdb_id: movieId,
      season_number: null
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try "↻ Refresh collections" again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

// ─── Curated universe pull (MCU, and any future hand-maintained universes) ────
const UNIVERSE_LISTS = {
  mcu: { label: 'MCU', titles: MCU_MOVIES }
};

async function pullUniverse(universeKey) {
  const universe = UNIVERSE_LISTS[universeKey];
  if (!universe) return;
  cancelTMDBPreview();
  const resultsEl = document.getElementById('tmdbResults');
  const previewEl = document.getElementById('tmdbPreview');
  resultsEl.innerHTML = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Looking up ${esc(universe.label)} titles…</div>`;

  const td = tabData[activeTabId];
  const existingRows = td?.rows || [];
  const found = [];
  const notFound = [];
  let backfilled = 0;

  for (const title of universe.titles) {
    // Step 1: always resolve the real TMDB match first — never skip this based
    // on a title-only guess, so we always know the real tmdb_id before deciding
    // whether this is already on the list.
    let match;
    try {
      const data = await tmdbFetch(`/search/movie?query=${encodeURIComponent(title)}`);
      match = (data.results || []).find(m => m.title.toLowerCase() === title.toLowerCase()) || (data.results || [])[0];
    } catch(e) {
      match = null;
    }
    if (!match) {
      notFound.push(title);
      continue;
    }

    // Step 2: now check existing rows using TMDB-first identity, falling back
    // to item_key only for rows that haven't been backfilled with a tmdb_id yet.
    // Uses the same shared helper as every other TMDB-driven flow, so this
    // logic can't drift out of sync with the canonical identity rules.
    const key = `${title.toLowerCase().trim()}|film`;
    const existingRow = findExistingRow(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: match.id });

    if (existingRow) {
      found.push({ title, alreadyAdded: true });
      // backfill the universe tag if this row predates the universe-pull feature
      const currentCollections = existingRow.collections || [];
      if (!currentCollections.includes(universe.label)) {
        const updated = [...currentCollections, universe.label];
        try {
          await sbFetch('PATCH', `${TABLE}?id=eq.${existingRow.id}`, { collections: updated });
          existingRow.collections = updated;
          backfilled++;
        } catch(e) { /* non-fatal — leave it as-is if the patch fails */ }
      }
    } else {
      found.push({ title, tmdbId: match.id, releaseDate: match.release_date, alreadyAdded: false });
    }
  }

  found.sort((a,b) => (a.releaseDate||'9999').localeCompare(b.releaseDate||'9999'));

  const rowsHtml = found.map(m => {
    const date = m.releaseDate ? formatDisplayDate(m.releaseDate) : 'TBA';
    return `<div class="tmdb-season-row ${m.alreadyAdded?'already-added':''}">
      <input type="checkbox" ${m.alreadyAdded?'disabled':'checked'} data-tmdb-id="${m.tmdbId||''}" data-title="${esc(m.title).replace(/'/g,"\\'")}" id="uni_${m.tmdbId||m.title.replace(/\W/g,'')}">
      <span class="tmdb-season-name">${esc(m.title)}</span>
      <span class="tmdb-season-meta">${esc(date)}</span>
      ${m.alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
    </div>`;
  }).join('');

  const notFoundHtml = notFound.length
    ? `<div class="tmdb-refresh-summary">Couldn't find on TMDB: ${notFound.map(esc).join(', ')}</div>`
    : '';
  const backfillHtml = backfilled > 0
    ? `<div class="tmdb-refresh-summary">✓ Tagged ${backfilled} already-added movie${backfilled===1?'':'s'} with "${esc(universe.label)}" that were missing it.</div>`
    : '';

  window.__universePullKey = universeKey;

  previewEl.innerHTML = `
    <div class="tmdb-preview">
      <div class="tmdb-preview-header">
        <div class="tmdb-preview-title">${esc(universe.label)}</div>
        <div class="tmdb-result-meta">${found.filter(f=>!f.alreadyAdded).length} new, ${found.filter(f=>f.alreadyAdded).length} already on your list</div>
      </div>
      ${backfillHtml}
      ${rowsHtml || '<div class="tmdb-no-results">Nothing found.</div>'}
      ${notFoundHtml}
      <div class="tmdb-preview-actions">
        <button class="btn btn-accent" onclick="addPulledUniverseMovies()">Add selected</button>
        <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
      </div>
    </div>
  `;
  if (backfilled > 0) { showSaved(); renderTable(); }
}

async function addPulledUniverseMovies() {
  const universeKey = window.__universePullKey;
  const universe = UNIVERSE_LISTS[universeKey];
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-tmdb-id]');

    }
  }

async function searchPersonForCollection() {
  const name = document.getElementById('personNameInput').value.trim();
  const resultsEl = document.getElementById('personMatchResults');
  if (!name) return;
  resultsEl.innerHTML = `<div class="tmdb-loading">Searching…</div>`;
  try {
    const data = await tmdbFetch(`/search/person?query=${encodeURIComponent(name)}`);
    const matches = (data.results || []).slice(0, 5);
    if (matches.length === 0) {
      resultsEl.innerHTML = `<div class="tmdb-no-results">No one found matching "${esc(name)}".</div>`;
      return;
    }
    resultsEl.innerHTML = matches.map(p => {
      const photo = p.profile_path ? `https://image.tmdb.org/t/p/w92${p.profile_path}` : '';
      const known = (p.known_for || []).map(k => k.title || k.name).filter(Boolean).slice(0,3).join(', ');
      const nameEsc = esc(p.name).replace(/'/g,"\\'");
      return `<div class="person-match-item" onclick="selectPersonForCollection(${p.id}, '${nameEsc}')">
        ${photo ? `<img class="person-match-photo" src="${photo}" alt="">` : '<div class="person-match-photo"></div>'}
        <div class="person-match-info">
          <div class="person-match-name">${esc(p.name)}</div>
          ${known ? `<div class="person-match-known">Known for: ${esc(known)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    resultsEl.innerHTML = `<div class="tmdb-no-results">Search failed: ${esc(e.message)}</div>`;
  }
}

async function selectPersonForCollection(personId, personName) {
  document.getElementById('personMatchResults').innerHTML = '';
  document.getElementById('personCollectionPrompt').style.display = 'none';
  personCollectionPromptOpen = false;
  cancelTMDBPreview();

  const previewEl = document.getElementById('tmdbPreview');
  previewEl.innerHTML = `<div class="tmdb-loading">Checking ${esc(personName)}'s credits…</div>`;

  let credits;
  try {
    credits = await tmdbFetch(`/person/${personId}/movie_credits`);
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Failed to load credits: ${esc(e.message)}</div>`;
    return;
  }
  const directorCount = (credits.crew || []).filter(c => c.job === 'Director').length;
  const castCount = (credits.cast || []).length;

  // smart default: if they've directed anything, default to Director; otherwise Actor
  const defaultRole = directorCount > 0 ? 'director' : 'actor';
  window.__personPullPending = { personId, personName, credits };

  previewEl.innerHTML = `
    <div class="tmdb-preview">
      <div class="tmdb-preview-header">
        <div class="tmdb-preview-title">${esc(personName)}</div>
        <div class="tmdb-result-meta">Which credits should count toward this collection?</div>
      </div>
      <div class="person-role-options">
        ${directorCount > 0 ? `<label class="person-role-option"><input type="radio" name="personRole" value="director" ${defaultRole==='director'?'checked':''}> Director only (${directorCount} film${directorCount===1?'':'s'})</label>` : ''}
        <label class="person-role-option"><input type="radio" name="personRole" value="actor" ${defaultRole==='actor'?'checked':''}> Actor only, lead/major roles (billing ≤ 15)</label>
        <label class="person-role-option"><input type="radio" name="personRole" value="actor-all"> Actor only, every credited role (${castCount} total — often very noisy)</label>
        ${directorCount > 0 ? `<label class="person-role-option"><input type="radio" name="personRole" value="both"> Both director and major acting roles</label>` : ''}
      </div>
      <div class="tmdb-preview-actions">

async function confirmPersonRole() {
  const pending = window.__personPullPending;
  if (!pending) return;
  const selected = document.querySelector('input[name="personRole"]:checked');
  const role = selected ? selected.value : 'director';
  await pullPersonFilmography(pending.personId, pending.personName, /*isNewCollection*/ true, role, pending.credits);
}

async function pullPersonFilmography(personId, personName, isNewCollection, role, preloadedCredits) {
  cancelTMDBPreview();
  const resultsEl = document.getElementById('tmdbResults');
  const previewEl = document.getElementById('tmdbPreview');
  resultsEl.innerHTML = '';
  previewEl.innerHTML = `<div class="tmdb-loading">Loading ${esc(personName)}'s filmography…</div>`;

  const td = tabData[activeTabId];
  const existingRows = td?.rows || [];

  try {
    const credits = preloadedCredits || await tmdbFetch(`/person/${personId}/movie_credits`);
    const CAST_ORDER_CUTOFF = 15; // roughly "billed in the main cast", excludes background/cameo noise
    const asDirector = (credits.crew || []).filter(c => c.job === 'Director');
    const asMajorCast = (credits.cast || []).filter(c => typeof c.order === 'number' && c.order <= CAST_ORDER_CUTOFF);
    const asAllCast = credits.cast || [];

    let sourceLists = [];
    if (role === 'director') sourceLists = [asDirector];
    else if (role === 'actor') sourceLists = [asMajorCast];
    else if (role === 'actor-all') sourceLists = [asAllCast];
    else if (role === 'both') sourceLists = [asDirector, asMajorCast];
    else sourceLists = [asDirector]; // fallback default

    const merged = new Map();
    sourceLists.flat().forEach(m => { if (!merged.has(m.id)) merged.set(m.id, m); });
    const movies = [...merged.values()].sort((a,b) => (a.release_date||'9999').localeCompare(b.release_date||'9999'));

    if (isNewCollection) {
      // save the collection definition once (including the role filter), so a later refresh
      // knows who to re-check and applies the same director/actor filter consistently
      try {
        await sbFetch('POST', 'custom_collections', [{ name: personName, tmdb_person_id: personId, role }]);
      } catch(e) {
        // Expected: this collection name already exists (unique constraint on name) —
        // fine, nothing to do. Anything else is a real failure and should be surfaced,
        // since it means the "↻ Refresh" link for this collection won't work later.
        if (!(e.message.includes('23505') || e.message.includes('duplicate key'))) {
          showError(`Movies added, but couldn't save this collection for future refresh checks: ${e.message}`);
        }
      }
    }

    let backfilled = 0;
    const found = [];
    for (const m of movies) {
      const title = m.title;
      const key = `${title.toLowerCase().trim()}|film`;
      // TMDB-first: a genuine tmdb_id match on an existing movie row means this
      // IS the same film, regardless of title text. Uses the same shared helper
      // as every other TMDB-driven flow, so this can't drift out of sync with
      // the canonical identity rules.
      const existingRow = findExistingRow(existingRows, { itemKey: key, mediaType: 'movie', tmdbId: m.id });
      if (existingRow) {
        const currentCollections = existingRow.collections || [];
        if (!currentCollections.includes(personName)) {
          const updated = [...currentCollections, personName];
          try {
            await sbFetch('PATCH', `${TABLE}?id=eq.${existingRow.id}`, { collections: updated });
            existingRow.collections = updated;
            backfilled++;
          } catch(e) { /* non-fatal */ }
        }
        found.push({ title, alreadyAdded: true, releaseDate: m.release_date });
      } else {
        found.push({ title, tmdbId: m.id, releaseDate: m.release_date, alreadyAdded: false });
      }
    }

    const rowsHtml = found.map(m => {
      const date = m.releaseDate ? formatDisplayDate(m.releaseDate) : 'TBA';
      return `<div class="tmdb-season-row ${m.alreadyAdded?'already-added':''}">
        <input type="checkbox" ${m.alreadyAdded?'disabled':'checked'} data-tmdb-id="${m.tmdbId||''}" data-title="${esc(m.title).replace(/'/g,"\\'")}" id="pc_${m.tmdbId||m.title.replace(/\W/g,'')}">
        <span class="tmdb-season-name">${esc(m.title)}</span>
        <span class="tmdb-season-meta">${esc(date)}</span>
        ${m.alreadyAdded ? '<span class="tmdb-already-tag">Already added</span>' : ''}
      </div>`;
    }).join('');

    const backfillHtml = backfilled > 0
      ? `<div class="tmdb-refresh-summary">✓ Tagged ${backfilled} already-added movie${backfilled===1?'':'s'} with "${esc(personName)}" that were missing it.</div>`
      : '';

    window.__personPullName = personName;

    previewEl.innerHTML = `
      <div class="tmdb-preview">
        <div class="tmdb-preview-header">
          <div class="tmdb-preview-title">${esc(personName)}</div>
          <div class="tmdb-result-meta">${found.filter(f=>!f.alreadyAdded).length} new, ${found.filter(f=>f.alreadyAdded).length} already on your list — everything's checked, deselect anything you don't want</div>
        </div>
        ${backfillHtml}
        ${rowsHtml || '<div class="tmdb-no-results">No film credits found.</div>'}
        <div class="tmdb-preview-actions">
          <button class="btn btn-accent" onclick="addPulledPersonMovies()">Add selected</button>
          <button class="btn" onclick="cancelTMDBPreview()">Cancel</button>
        </div>
      </div>
    `;
    if (backfilled > 0) { showSaved(); renderFilters(); renderTable(); }
  } catch(e) {
    previewEl.innerHTML = `<div class="tmdb-no-results">Failed to load filmography: ${esc(e.message)}</div>`;
  }
}

async function addPulledPersonMovies() {
  const personName = window.__personPullName;
  if (!personName) return;
  const isMoviesTab = COLLECTIONS.find(c => c.id === activeTabId)?.isMovieTab;
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-tmdb-id]');
  const seenTmdbIds = new Set();
  const toInsert = [];

  for (const cb of checkboxes) {
    if (!cb.checked || cb.disabled) continue;
    const tmdbId = cb.dataset.tmdbId;
    const title = cb.dataset.title;
    if (!tmdbId) continue;
    // Dedupe by tmdbId, not by title/item_key — every selected checkbox here
    // already carries a real TMDB movie ID, so two different movies that
    // happen to share a title must never be conflated into one skipped entry.
    if (seenTmdbIds.has(tmdbId)) continue; // guard against the exact same movie appearing twice in this batch
    seenTmdbIds.add(tmdbId);
    const key = `${title.toLowerCase().trim()}|film`;
    let details;
    try { details = await tmdbFetch(`/movie/${tmdbId}`); } catch(e) { continue; }
    const network = isMoviesTab
      ? ((details.genres && details.genres[0]?.name) || 'Film')
      : ((details.production_companies && details.production_companies[0]?.name) || 'Film');
    const displayDate = details.release_date ? formatDisplayDate(details.release_date) : 'TBA';
    const dateSort = details.release_date || '2099-01-01';
    const belongsTo = details.belongs_to_collection;
    const collections = belongsTo ? [cleanCollectionName(belongsTo.name), personName] : [personName];
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title,
      season: 'Film',
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      tmdb_collection_id: belongsTo ? belongsTo.id : null,
      tmdb_collection_name: belongsTo ? cleanCollectionName(belongsTo.name) : null,
      collections,
      media_type: 'movie',
      tmdb_id: parseInt(tmdbId, 10),
      season_number: null
    });
  }

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (e.message.includes('23505') || e.message.includes('duplicate key')) {
      showError(`One or more of these movies is already on your list but wasn't detected in time — try clicking "+ start a person collection" again for a fresh check, or reload the page first.`);
    } else {
      showError(e.message);
    }
  }
}

// Refresh a person-linked custom collection (called from the Collections filter area)
async function refreshPersonCollection(collectionName) {
  try {
    const rows = await sbFetch('GET', `custom_collections?name=eq.${encodeURIComponent(collectionName)}&select=*`, null);
    const entry = (rows || [])[0];
    if (!entry) {
      showError(`Couldn't find a linked person for "${collectionName}" — it may be an older collection from before this feature existed.`);
      return;
    }
    await pullPersonFilmography(entry.tmdb_person_id, entry.name, /*isNewCollection*/ false, entry.role || 'director');
    document.getElementById('tmdbPreview')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch(e) {
    showError(e.message);
  }
}

async function addRefreshedSeasons() {
  const data = window.__refreshData || [];
  const checkboxes = document.querySelectorAll('#tmdbPreview input[type="checkbox"][data-show-idx]');
  const toInsert = [];

  checkboxes.forEach(cb => {
    if (!cb.checked) return;
    const idx = parseInt(cb.dataset.showIdx, 10);
    const num = parseInt(cb.dataset.season, 10);
    const entry = data[idx];
    if (!entry) return;
    const s = entry.newOnes.find(x => x.season_number === num);
    if (!s) return;
    const network = (entry.details.networks && entry.details.networks[0]?.name) || 'Unknown';
    const seasonLabel = num === 0 ? 'Specials' : `Season ${num}`;
    const key = `${entry.show.title.toLowerCase().trim()}|${seasonLabel.toLowerCase()}`;
    const displayDate = s.air_date ? formatDisplayDate(s.air_date) : 'TBA';
    const dateSort = s.air_date || '2099-01-01';
    toInsert.push({
      collection: activeTabId,
      item_key: key,
      title: entry.show.title,
      season: seasonLabel,
      theme: network,
      display_date: displayDate,
      date_sort: dateSort,
      watched: false,
      status: 'confirmed',
      media_type: 'tv',
      tmdb_id: entry.show.tmdb_id,
      season_number: num
    });
  });

  if (toInsert.length === 0) { cancelTMDBPreview(); return; }

  try {
    const inserted = await sbFetch('POST', TABLE, toInsert);
    if (inserted) tabData[activeTabId].rows.push(...inserted);
    tabData[activeTabId].rows.sort((a,b) => a.date_sort.localeCompare(b.date_sort));
    showSaved();
    resetTMDBSearchUI();
    renderFilters();
    renderTable();
  } catch(e) {
    if (isDuplicateKeyError(e)) {
      showError(duplicateInsertMessage('try "↻ Refresh shows" again for a fresh check'));
    } else {
      showError(e.message);
    }
  }
}

// ─── Backup button ──────────────────────────────────────────────────────────
async function handleBackupClick() {
  const btn = document.getElementById('backupBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Backing up…';
  try {
    const backup = await buildBackupObject();
    downloadJSON(backup, `watchlist-backup-${timestampForFilename()}.json`);
    recordBackupTimestamp();
    showSaved();
  } catch(e) {
    showError(`Backup failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}


// ─── Restore flow ───────────────────────────────────────────────────────────
let pendingRestoreData = null; // validated backup object, set once file passes checks

function handleRestoreClick() {
  document.getElementById('restoreFileInput').click();
}

function validateBackupObject(obj) {
  const errors = [];
  if (!obj || typeof obj !== 'object') { errors.push('File does not contain a JSON object.'); return errors; }
  if (obj.format !== BACKUP_FORMAT) errors.push(`Unrecognized backup format ("${obj.format}") — this doesn't look like a Watchlist Tracker backup file.`);
  if (typeof obj.formatVersion !== 'number' || obj.formatVersion > BACKUP_FORMAT_VERSION) errors.push(`Unsupported backup format version (${obj.formatVersion}).`);
  if (!obj.exportedAt || isNaN(Date.parse(obj.exportedAt))) errors.push('Missing or invalid export timestamp.');
  if (!obj.tables || typeof obj.tables !== 'object') { errors.push('Missing "tables" section.'); return errors; }
  for (const table of BACKUP_TABLES) {
    if (!Array.isArray(obj.tables[table])) {
      errors.push(`Missing or invalid data for table "${table}".`);
      continue;
    }
    const declaredCount = obj.rowCounts?.[table];
    if (typeof declaredCount === 'number' && declaredCount !== obj.tables[table].length) {
      errors.push(`Row count mismatch for "${table}": file claims ${declaredCount} but contains ${obj.tables[table].length}.`);
    }
  }
  // spot-check required fields on watchlist_items rows, the most important table
  const items = obj.tables.watchlist_items || [];
  const missingItemFields = items.filter(r => !r.id || !r.item_key || !r.collection);
  if (missingItemFields.length > 0) errors.push(`${missingItemFields.length} row(s) in watchlist_items are missing required fields (id, item_key, or collection).`);

  // othertv_shows: id, tmdb_id, title are NOT NULL with no default in the verified
  // schema — required. network/collection are NOT NULL but have defaults, so they're
  // not required here (an absent value would still restore safely).
  const othertv = obj.tables.othertv_shows || [];
  const missingOthertvFields = othertv.filter(r => r.id == null || r.tmdb_id == null || !r.title);
  if (missingOthertvFields.length > 0) errors.push(`${missingOthertvFields.length} row(s) in othertv_shows are missing required fields (id, tmdb_id, or title).`);

  // custom_collections: id, name, tmdb_person_id are NOT NULL with no default in the
  // verified schema — required. role is nullable with a default, so it's optional.
  const customCollections = obj.tables.custom_collections || [];
  const missingCollectionFields = customCollections.filter(r => r.id == null || !r.name || r.tmdb_person_id == null);
  if (missingCollectionFields.length > 0) errors.push(`${missingCollectionFields.length} row(s) in custom_collections are missing required fields (id, name, or tmdb_person_id).`);

  return errors;
}

async function handleRestoreFileSelected(event) {
  const file = event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file later
  if (!file) return;

  let parsed;
  try {
    const text = await file.text();
    parsed = JSON.parse(text);
  } catch(e) {
    showRestoreModal(`<div class="modal-title">Invalid backup file</div>
      <div class="modal-error">Couldn't parse this file as JSON: ${esc(e.message)}</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }

  const errors = validateBackupObject(parsed);
  if (errors.length > 0) {
    showRestoreModal(`<div class="modal-title">This file can't be used for restore</div>
      <div class="modal-error">${errors.map(esc).join('\n')}</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }

  pendingRestoreData = parsed;
  await renderRestorePreview(parsed);
}

async function renderRestorePreview(backup) {
  showRestoreModal(`<div class="modal-title">Checking current data…</div><div class="modal-progress">Fetching current row counts for comparison…</div>`);

  let currentCounts = {};
  try {
    for (const table of BACKUP_TABLES) {
      const rows = await fetchAllRows(table);
      currentCounts[table] = rows.length;
    }
  } catch(e) {
    showRestoreModal(`<div class="modal-title">Couldn't check current data</div>
      <div class="modal-error">${esc(e.message)}</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }

  const backupDate = new Date(backup.exportedAt).toLocaleString();
  const rows = BACKUP_TABLES.map(t => `
    <div class="modal-row"><span>${esc(t)}</span><span>${currentCounts[t]} → ${backup.rowCounts[t] ?? backup.tables[t].length}</span></div>
  `).join('');

  showRestoreModal(`
    <div class="modal-title">Restore from backup?</div>
    <div class="modal-section">
      <div class="modal-label">Backup created</div>
      <div>${esc(backupDate)}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Rows: current → backup</div>
      ${rows}
    </div>
    <div class="modal-warning">This will permanently replace all current data in these 3 tables with the contents of this backup. A safety backup of your current data will be downloaded automatically before anything is changed.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRestoreModal()">Cancel</button>
      <button class="btn-danger" id="confirmRestoreBtn" onclick="executeRestore()">Restore database</button>
    </div>
  `);
}

function showRestoreModal(html) {
  document.getElementById('restoreModalBox').innerHTML = html;
  document.getElementById('restoreModalOverlay').style.display = 'flex';
}
function closeRestoreModal() {
  document.getElementById('restoreModalOverlay').style.display = 'none';
  document.getElementById('restoreModalBox').innerHTML = '';
  pendingRestoreData = null;
}

async function executeRestore() {
  const backup = pendingRestoreData;
  if (!backup) { closeRestoreModal(); return; }

  const confirmBtn = document.getElementById('confirmRestoreBtn');
  if (confirmBtn) confirmBtn.disabled = true;

  const setProgress = (msg) => {
    showRestoreModal(`<div class="modal-title">Restoring…</div><div class="modal-progress">${esc(msg)}</div>`);
  };

  // ── Step 1: automatic safety backup of the CURRENT live data, before anything is touched ──
  setProgress('Backing up your current data first (safety copy)…');
  let preRestoreBackup;
  try {
    preRestoreBackup = await buildBackupObject();
  } catch(e) {
    showRestoreModal(`<div class="modal-title">Restore aborted</div>
      <div class="modal-error">Couldn't create a safety backup of your current data, so nothing was changed:\n${esc(e.message)}</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }
  const preRestoreFilename = `watchlist-pre-restore-${timestampForFilename()}.json`;
  try {
    downloadJSON(preRestoreBackup, preRestoreFilename);
  } catch(e) {
    showRestoreModal(`<div class="modal-title">Restore aborted</div>
      <div class="modal-error">The safety backup couldn't be downloaded, so nothing was changed:\n${esc(e.message)}</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }

  // ── Pause here: do not proceed to any destructive step until the user has
  // explicitly confirmed they can see the safety backup file. pendingRestoreData
  // (the validated backup to restore) is untouched and still available — we're
  // only waiting on a click, not discarding any state.
  showRestoreModal(`
    <div class="modal-title">Safety backup downloaded</div>
    <div class="modal-section">
      <div class="modal-label">Filename</div>
      <div style="font-family:monospace; font-size:13px; word-break:break-all;">${esc(preRestoreFilename)}</div>
    </div>
    <div class="modal-warning">Before continuing: please check your Downloads folder (or wherever your browser saves files) and confirm you can see this file. This is your only copy of your current data if anything goes wrong with the restore.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRestoreModal()">Cancel</button>
      <button class="btn-danger" onclick="continueRestoreAfterSafetyConfirm('${esc(preRestoreFilename).replace(/'/g,"\\'")}')">I have the backup — continue restore</button>
    </div>
  `);
}

async function continueRestoreAfterSafetyConfirm(preRestoreFilename) {
  const backup = pendingRestoreData;
  if (!backup) { closeRestoreModal(); return; }

  const setProgress = (msg) => {
    showRestoreModal(`<div class="modal-title">Restoring…</div><div class="modal-progress">${esc(msg)}</div>`);
  };

  // ── Step 2: delete existing rows, then insert backup rows, table by table ──
  const completedTables = [];
  try {
    for (const table of BACKUP_TABLES) {
      setProgress(`Clearing ${table}…`);
      await deleteAllRows(table);
      const rowsToInsert = backup.tables[table];
      if (rowsToInsert.length > 0) {
        setProgress(`Restoring ${table} (${rowsToInsert.length} rows)…`);
        await batchInsertRows(table, rowsToInsert);
      }
      completedTables.push(table);
    }
  } catch(e) {
    showRestoreModal(`<div class="modal-title">Restore failed partway through</div>
      <div class="modal-error">Completed: ${completedTables.length ? completedTables.join(', ') : 'none'}
Failed: ${esc(e.message)}

Your data is now in a MIXED state — do not treat this as complete. A safety backup of your data from before this restore was downloaded as:
${esc(preRestoreFilename)}

You can restore that file to return to your pre-restore state.</div>
      <div class="modal-actions"><button class="btn" onclick="closeRestoreModal()">Close</button></div>`);
    return;
  }

  // ── Step 3: re-fetch and verify against the backup before declaring success ──
  setProgress('Verifying restored data…');
  const verificationErrors = [];
  try {
    for (const table of BACKUP_TABLES) {
      const restoredRows = await fetchAllRows(table);
      const expectedRows = backup.tables[table];
      if (restoredRows.length !== expectedRows.length) {
        verificationErrors.push(`${table}: expected ${expectedRows.length} rows, found ${restoredRows.length}.`);
        continue;
      }
      const restoredById = new Map(restoredRows.map(r => [r.id, r]));
      const missingIds = expectedRows.filter(r => !restoredById.has(r.id));
      if (missingIds.length > 0) {
        verificationErrors.push(`${table}: ${missingIds.length} expected row(s) not found after restore.`);
        continue;
      }
      // Every expected row exists by id — now compare every backed-up field
      // value exactly, not just presence. Report per-row field mismatches,
      // capped to the first 10 for readability, with a total count if more exist.
      const rowMismatches = [];
      for (const expectedRow of expectedRows) {
        const restoredRow = restoredById.get(expectedRow.id);
        const diffFields = compareRowFields(expectedRow, restoredRow);
        if (diffFields.length > 0) {
          rowMismatches.push({ id: expectedRow.id, fields: diffFields });
        }
      }
      if (rowMismatches.length > 0) {
        const shown = rowMismatches.slice(0, 10)
          .map(m => `  • row ${m.id}: ${m.fields.join(', ')}`)
          .join('\n');
        const more = rowMismatches.length > 10 ? `\n  …and ${rowMismatches.length - 10} more row(s) with mismatches.` : '';
        verificationErrors.push(`${table}: ${rowMismatches.length} row(s) have field values that don't match the backup:\n${shown}${more}`);
      }
    }
  } catch(e) {
    verificationErrors.push(`Couldn't complete verification: ${e.message}`);
  }

  if (verificationErrors.length > 0) {
    showRestoreModal(`<div class="modal-title">Restore finished, but verification failed</div>
      <div class="modal-error">The restore ran, but the data afterward didn't match the backup exactly:
${verificationErrors.map(esc).join('\n')}

A safety backup of your data from before this restore was downloaded as:
${esc(preRestoreFilename)}</div>
      <div class="modal-actions"><button class="btn" onclick="finishRestoreAndReload()">Close &amp; reload data</button></div>`);
    return;
  }

  // ── Step 4: success — only reached if delete+insert+verify all passed for every table ──
  showRestoreModal(`<div class="modal-title">Restore completed successfully</div>
    <div class="modal-success">All ${BACKUP_TABLES.length} tables restored and verified against the backup.
A safety backup of your data from before this restore was saved as:
${esc(preRestoreFilename)}</div>
    <div class="modal-actions"><button class="btn-accent btn" onclick="finishRestoreAndReload()">Close &amp; reload data</button></div>`);
}

// Clears all cached tab data and reloads the currently active tab from
// Supabase, so the UI reflects the real post-restore database state rather
// than stale in-memory data. Other tabs will refetch next time they're opened.
function finishRestoreAndReload() {
  closeRestoreModal();
  tabData = {};
  loadTab(activeTabId);
}


const LAST_BACKUP_KEY = 'watchlist_last_backup_at';

function recordBackupTimestamp() {
  localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
  updateBackupAgeIndicator();
}

function updateBackupAgeIndicator() {
  const el = document.getElementById('backupAgeIndicator');
  if (!el) return;
  const lastStr = localStorage.getItem(LAST_BACKUP_KEY);
  if (!lastStr) {
    el.textContent = 'No backup yet';
    el.className = 'backup-age warn';
    return;
  }
  const last = new Date(lastStr);
  const days = Math.floor((Date.now() - last.getTime()) / (1000*60*60*24));
  if (days < 14) {
    el.textContent = days === 0 ? 'Backed up today' : `Backup: ${days}d ago`;
    el.className = 'backup-age';
  } else if (days < 30) {
    el.textContent = `Backup: ${days}d ago`;
    el.className = 'backup-age warn';
  } else {
    el.textContent = `Backup recommended (${days}d ago)`;
    el.className = 'backup-age urgent';
  }
}

// ─── Boot ────────────────────────────────────────────────────────────────────
buildMediaSwitch();
buildTabs();
loadTab(activeTabId);
updateBackupAgeIndicator();
</script>
