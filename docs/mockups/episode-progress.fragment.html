<style>
#wl-progress{--wp-bg:light-dark(#faf9f6,#181b20);--wp-panel:light-dark(#ffffff,#21252b);--wp-ink:light-dark(#242e38,#edf1f5);--wp-muted:light-dark(#626d78,#aeb8c3);--wp-line:light-dark(#dce1e5,#3b424b);--wp-accent:light-dark(#276957,#7bc8ad);--wp-soft:light-dark(#e7f1ec,#273d36);font:14px/1.5 system-ui,sans-serif;color:var(--wp-ink)}
#wl-progress *{box-sizing:border-box}#wl-progress .window{background:var(--wp-bg);border:1px solid var(--wp-line);border-radius:14px;overflow:hidden;min-height:810px}#wl-progress header{padding:22px 24px 16px;background:var(--wp-panel);border-bottom:1px solid var(--wp-line)}#wl-progress .brand{font-size:23px;font-weight:600;margin-bottom:16px}#wl-progress nav{display:flex;gap:24px;flex-wrap:wrap;color:var(--wp-muted)}#wl-progress nav span:first-child{color:var(--wp-accent);font-weight:600}#wl-progress main{padding:22px 24px}#wl-progress h2{font-size:20px;margin:0 0 18px;font-weight:600}#wl-progress .show{background:var(--wp-panel);border:1px solid var(--wp-line);border-radius:10px;overflow:hidden}#wl-progress .show-head{padding:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#wl-progress .show-title{font-size:17px;font-weight:600}#wl-progress .sub{color:var(--wp-muted);font-size:12px}#wl-progress .badge{margin-left:auto;background:var(--wp-soft);color:var(--wp-accent);padding:4px 10px;border-radius:20px;font-size:12px}#wl-progress .season{border-top:1px solid var(--wp-line)}#wl-progress .season-top{display:flex;align-items:center;gap:12px;padding:13px 18px;flex-wrap:wrap}#wl-progress .expand{border:0;background:none;color:inherit;text-align:left;flex:1;padding:4px 0;font:inherit;min-width:130px}#wl-progress .track{height:5px;background:var(--wp-line);border-radius:5px;margin-top:7px;max-width:240px;overflow:hidden}#wl-progress .fill{height:100%;background:var(--wp-accent)}#wl-progress .count{font-size:12px;color:var(--wp-muted);min-width:95px;text-align:right}#wl-progress input{accent-color:var(--wp-accent);width:18px;height:18px;margin:0}#wl-progress .season-check{display:flex;align-items:center;padding:8px}#wl-progress .episodes{padding:0 18px 14px 52px}#wl-progress .tools{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:3px 0 8px;flex-wrap:wrap}#wl-progress button.action{font:inherit;font-size:12px;background:var(--wp-panel);color:var(--wp-accent);border:1px solid var(--wp-line);border-radius:6px;padding:7px 10px}#wl-progress .episode{display:flex;gap:12px;align-items:center;border-top:1px solid var(--wp-line);padding:10px 0;min-height:49px}#wl-progress .episode label{display:flex;gap:12px;align-items:center;flex:1}#wl-progress .num{color:var(--wp-muted);width:25px;font-size:12px}#wl-progress .epname{flex:1}#wl-progress .watched .epname{color:var(--wp-muted)}#wl-progress .through{background:none;border:0;color:var(--wp-accent);font:inherit;font-size:12px;padding:8px 0}#wl-progress .detail{padding:16px 18px;background:var(--wp-bg);border-top:1px solid var(--wp-line)}#wl-progress .detail .episodes{padding:0}#wl-progress .back{background:none;border:0;color:var(--wp-accent);padding:0 0 12px;font:inherit}#wl-progress .notice{min-height:24px;margin-top:13px;color:var(--wp-accent);font-size:12px}#wl-progress .preview-tag{font-size:11px;color:var(--wp-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}@media(max-width:480px){#wl-progress main{padding:18px 12px}#wl-progress header{padding:18px 16px}#wl-progress nav{gap:16px}#wl-progress .episodes{padding-left:18px}#wl-progress .through{max-width:65px;text-align:right}#wl-progress .season-top{gap:5px}#wl-progress .count{min-width:78px}#wl-progress .window{min-height:870px}}
</style>
<div id="wl-progress">
<div class="viz-carousel" aria-label="Episode progress designs">
<section data-variant="Inline expansion"><div class="window" data-design="inline"></div></section>
<section data-variant="Season detail" hidden><div class="window" data-design="detail"></div></section>
</div>
</div>
<script>
(()=>{
const root=document.getElementById('wl-progress');
const titles=['Chapter 17: The Apostate','Chapter 18: The Mines of Mandalore','Chapter 19: The Convert','Chapter 20: The Foundling','Chapter 21: The Pirate','Chapter 22: Guns for Hire','Chapter 23: The Spies','Chapter 24: The Return'];
const initial=window.openai?.widgetState?.modelContent?.watched;
let marks=Array.isArray(initial)&&initial.length===8?initial:[true,true,true,true,true,false,false,false];
let expanded=true;let detail=false;let message='';const appearance={titles:true,bars:true};
function persist(){window.openai?.setWidgetState({modelContent:{watched:marks},privateContent:{expanded,detail}})?.catch(()=>{});}
function episodes(){return `<div class="episodes"><div class="tools"><span class="sub">Season 3 · 8 episodes</span><button class="action" data-all>Mark all watched</button></div>${titles.map((t,i)=>`<div class="episode ${marks[i]?'watched':''}"><label><input type="checkbox" data-episode="${i}" ${marks[i]?'checked':''} aria-label="Episode ${i+1} watched"><span class="num">E${i+1}</span><span class="epname">${appearance.titles?t:'Episode '+(i+1)}</span></label>${!marks[i]?`<button class="through" data-through="${i}" aria-label="Mark watched through episode ${i+1}">Mark through</button>`:''}</div>`).join('')}</div>`;}
function render(){const n=marks.filter(Boolean).length;root.querySelectorAll('.window').forEach(w=>{const isDetail=w.dataset.design==='detail';w.innerHTML=`<header><div class="brand">Watchlist</div><nav aria-label="Watchlist sections"><span>TV</span><span>Movies</span><span>Collections</span><span>Settings</span></nav></header><main><div class="preview-tag">Concept preview · sample progress</div><h2>Currently Watching</h2><div class="show"><div class="show-head"><div><div class="show-title">The Mandalorian</div><div class="sub">${n===8?'Season 3 complete':`Up next: S3 E${marks.findIndex(v=>!v)+1} · ${appearance.titles?titles[marks.findIndex(v=>!v)]:''}`}</div></div><span class="badge">Watching</span></div>${isDetail&&detail?`<div class="detail"><button class="back" data-back>‹ All seasons</button><div class="tools"><strong>Season 3</strong><span class="sub">${n}/8 watched${n===8?' · Complete':''}</span></div>${episodes()}</div>`:[3,2,1].map(s=>{const count=s===3?n:8;return `<div class="season"><div class="season-top"><label class="season-check"><input type="checkbox" ${count===8?'checked':''} data-season="${s}" aria-label="Season ${s} watched"></label><button class="expand" data-expand="${s}" aria-expanded="${s===3&&expanded&&!isDetail}">${s===3&&expanded&&!isDetail?'▾':'▸'} Season ${s}${appearance.bars?`<div class="track"><div class="fill" style="width:${count/8*100}%"></div></div>`:''}</button><span class="count">${count}/8 watched<br>${count===8?'Complete':count?'In progress':'Not started'}</span></div>${s===3&&expanded&&!isDetail?episodes():''}</div>`;}).join('')}</div><div class="notice" aria-live="polite">${message}</div></main>`;});}
root.addEventListener('change',e=>{const x=e.target;if(x.dataset.episode!==undefined){marks[+x.dataset.episode]=x.checked;message=marks.every(Boolean)?'Season 3 marked watched.':`Episode ${+x.dataset.episode+1} ${x.checked?'marked watched':'marked unwatched'}.`;}else if(x.dataset.season==='3'){marks=marks.map(()=>x.checked);message=x.checked?'Season 3 and all 8 episodes marked watched.':'Season 3 and its episodes marked unwatched.';}else{message='This preview edits Season 3 only.';}persist();render();});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.expand){if(b.dataset.expand!=='3'){message='Season 3 is the interactive example.';}else if(b.closest('.window').dataset.design==='detail'){detail=true;}else expanded=!expanded;}if(b.hasAttribute('data-back'))detail=false;if(b.hasAttribute('data-all')){marks=marks.map(()=>true);message='Season 3 marked watched.';}if(b.dataset.through!==undefined){marks=marks.map((v,i)=>i<=+b.dataset.through?true:v);message=`Marked watched through episode ${+b.dataset.through+1}.`;}persist();render();});
window.addEventListener('openai:set_globals',e=>{const m=e.detail?.globals?.widgetState?.modelContent?.watched;if(Array.isArray(m)&&m.length===8){marks=m;render();}});
render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(appearance,'titles',{label:'Episode titles'});t.addToggle(appearance,'bars',{label:'Progress bars'});}
})();
</script>
